<head>

  <title>Music Disco Ball</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000008;
      overflow:hidden;
      font-family:'Apple SD Gothic Neo',-apple-system,'Noto Sans KR',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    #bg-canvas { position:fixed; inset:0; z-index:0; display:block; }
    #three-canvas { position:fixed; inset:0; z-index:1; display:block; }

    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px; z-index:50;
      background:#000008;
    }
    .ld-label { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.35); text-transform:uppercase; }
    .ld-dots { display:flex; gap:8px; }
    .ld-dots span {
      width:5px; height:5px; border-radius:50%; background:rgba(180,140,255,.7);
      animation:dp 1.4s ease-in-out infinite;
    }
    .ld-dots span:nth-child(2){ animation-delay:.2s; }
    .ld-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes dp { 0%,80%,100%{transform:scale(.5);opacity:.3} 40%{transform:scale(1);opacity:1} }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

    #top {
      position:absolute; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:26px 32px;
    }
    .logo-wrap { display:flex; flex-direction:column; gap:4px; }
    .logo { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.75); text-transform:uppercase; }
    .logo-sub { font-size:9px; letter-spacing:2px; color:rgba(255,255,255,.35); text-transform:uppercase; font-style:italic; }
    .back {
      font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.5);
      text-decoration:none; pointer-events:all; transition:color .3s;
    }
    .back:hover { color:#fff; }

    #search-wrap {
      position:absolute; top:26px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:6px; pointer-events:all;
    }
    #search-icon { position:absolute; left:10px; font-size:11px; color:rgba(255,255,255,.35); pointer-events:none; }
    #search-input {
      width:200px; background:rgba(0,0,20,.7); border:1px solid rgba(255,255,255,.13);
      border-radius:20px; padding:6px 30px 6px 30px; font-size:12px; color:rgba(255,255,255,.85);
      outline:none; transition:all .3s; backdrop-filter:blur(10px);
    }
    #search-input::placeholder { color:rgba(255,255,255,.28); }
    #search-input:focus { border-color:rgba(200,160,255,.5); width:240px; }
    #search-clear {
      position:absolute; right:10px; font-size:13px; color:rgba(255,255,255,.35);
      cursor:pointer; pointer-events:all; transition:color .2s; display:none;
    }
    #search-clear:hover { color:rgba(255,255,255,.8); }

    #count {
      position:absolute; bottom:100px; right:32px;

    }
    #hint {
      position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:2.5px; color:rgba(255,255,255,.4); white-space:nowrap;

    @keyframes hFade { 0%,60%{opacity:1} 100%{opacity:0} }

    #date-nav {
      position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
      display:flex; gap:5px; pointer-events:all;
      opacity:0; transition:opacity .5s;
    }
    #date-nav.show { opacity:1; }

    .date-btn:hover { border-color:rgba(180,140,255,.4); color:rgba(255,255,255,.8); }
    .date-btn.active { border-color:rgba(180,140,255,.5); color:#fff; background:rgba(130,80,200,.15); }

    /* 툴팁 */
    #tip {
      position:fixed; z-index:30; width:210px;
      background:rgba(0,0,14,.93); border:1px solid rgba(255,255,255,.1);
      border-radius:16px; backdrop-filter:blur(24px);

    #tip-art { width:100%; height:105px; background:rgba(255,255,255,.04); overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative; }
    #tip-art img { width:100%; height:100%; object-fit:cover; }
    #tip-art-bg { position:absolute; inset:0; opacity:.4; }
    .tip-body { padding:10px 13px 12px; }
    #tip-t { font-size:13px; font-weight:700; color:rgba(255,255,255,.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #tip-a { font-size:11px; color:rgba(255,255,255,.38); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #tip-genre { display:inline-block; margin-top:7px; font-size:8px; letter-spacing:1.5px; padding:3px 9px; border-radius:20px; text-transform:uppercase; font-weight:600; }
    #tip-mood { font-size:10px; color:rgba(255,255,255,.5); margin-top:6px; font-style:italic; }
    #tip-h { font-size:8px; color:rgba(255,255,255,.18); margin-top:8px; letter-spacing:1.5px; }

    /* 플레이어 바 */
    #player-bar {
      position:fixed; bottom:0; left:0; right:0; z-index:20;
      height:88px; background:rgba(4,4,18,.95);
      border-top:1px solid rgba(255,255,255,.07); backdrop-filter:blur(30px);
      display:flex; align-items:center; gap:14px; padding:0 22px;
      transform:translateY(100%); transition:transform .4s cubic-bezier(.4,0,.2,1);
    }
    #player-bar.open { transform:translateY(0); }
    #player-video { width:136px; height:76px; border-radius:7px; overflow:hidden; flex-shrink:0; background:#000; cursor:pointer; position:relative; }
    #player-video iframe { width:100%; height:100%; border:0; }
    #player-video .veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); font-size:20px; opacity:0; transition:opacity .2s; }
    #player-video:hover .veil { opacity:1; }
    #player-info { flex:1; min-width:0; }
    #player-title { font-size:14px; font-weight:600; color:rgba(255,255,255,.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #player-artist { font-size:12px; color:rgba(255,255,255,.4); margin-top:3px; }
    #player-searching { font-size:11px; color:rgba(255,255,255,.25); letter-spacing:2px; margin-top:4px; display:none; }
    #player-searching.on { display:block; }
    #player-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .pc-btn { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.7); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; }
    .pc-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .pc-btn.play-btn { width:46px; height:46px; font-size:18px; background:rgba(180,140,255,.12); }
    #player-close { width:30px; height:30px; border-radius:50%; background:transparent; border:none; color:rgba(255,255,255,.3); font-size:17px; cursor:pointer; transition:color .2s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    #player-close:hover { color:rgba(255,255,255,.8); }

    /* Now playing 토스트 */
    #now-toast {
      position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-10px);
      display:flex; align-items:center; gap:12px;
      background:rgba(5,5,22,.93); border:1px solid rgba(255,255,255,.08);

    #now-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #now-dot { width:7px; height:7px; border-radius:50%; background:rgba(180,140,255,.95); box-shadow:0 0 10px 3px rgba(180,140,255,.35); animation:npulse 1.1s ease-in-out infinite; flex-shrink:0; }
    @keyframes npulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
    #now-label { font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,.25); text-transform:uppercase; margin-bottom:2px; }
    #now-title { font-size:13px; font-weight:600; color:rgba(255,255,255,.92); }
    #now-artist { font-size:10px; color:rgba(255,255,255,.35); margin-top:1px; }

    @media (pointer:coarse) {

      #player-title { font-size:13px; }
      #date-nav { bottom:92px; }
      #count { bottom:92px; }
    }

// ═══════════════════════════════════════════
// 배경 캔버스 (성운 + 별)
// ═══════════════════════════════════════════
function buildBg() {
  const cv = document.getElementById('bg-canvas');
  const W = innerWidth, H = innerHeight;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  // 기본 어두운 배경
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  // 성운 블롭
  const blobs = [
    { x: W * 0.25, y: H * 0.3,  r: W * 0.35, c: 'rgba(80,30,140,' },
    { x: W * 0.75, y: H * 0.65, r: W * 0.3,  c: 'rgba(20,50,120,' },
    { x: W * 0.5,  y: H * 0.5,  r: W * 0.2,  c: 'rgba(100,30,160,' },
  ];
  for (const b of blobs) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0,   b.c + '0.12)');
    g.addColorStop(0.5, b.c + '0.06)');
    g.addColorStop(1,   b.c + '0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // 별 200개
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const sz = Math.random() * 1.5 + 0.3;
    const op = Math.random() * 0.7 + 0.1;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${op})`;
    ctx.fill();
  }
}
buildBg();
window.addEventListener('resize', buildBg);

// ═══════════════════════════════════════════
// YouTube 플레이어
// ═══════════════════════════════════════════
let ytPlayer = null, ytReady = false;
let playlist = [], playIdx = 0, isPlaying = false;

window.onYouTubeIframeAPIReady = () => {
  ytPlayer = new YT.Player('yt-frame', {
    height:'76', width:'136',
    playerVars: { autoplay:1, controls:0, rel:0, modestbranding:1, playsinline:1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        isPlaying = e.data === YT.PlayerState.PLAYING;
        document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
        if (e.data === YT.PlayerState.ENDED) playNext();
      },
    },
  });
};
const _yt = document.createElement('script');
_yt.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(_yt);

async function searchVideo(song) {
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_KEY}`);
  const d = await r.json();
  return d.items?.[0]?.id?.videoId ?? null;
}

function showNowPlaying(song) {
  document.getElementById('now-title').textContent  = song.t;
  document.getElementById('now-artist').textContent = song.a;
  const t = document.getElementById('now-toast');
  t.classList.add('show');
  clearTimeout(window._nowTimer);
  window._nowTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

async function playSong(song) {
  // 재생 타일 업데이트
  playingTile = tiles.find(m => m.userData.t === song.t && m.userData.a === song.a) ?? null;
  playlist = [...tiles.map(m => ({ t: m.userData.t, a: m.userData.a, g: m.userData.g }))];
  playIdx   = playlist.findIndex(s => s.t === song.t && s.a === song.a);

  document.getElementById('player-title').textContent  = song.t;
  document.getElementById('player-artist').textContent = song.a;
  document.getElementById('player-searching').classList.add('on');
  document.getElementById('player-bar').classList.add('open');
  showNowPlaying(song);

  try {
    const vid = await searchVideo(song);
    document.getElementById('player-searching').classList.remove('on');
    if (!vid) {
      window.open(`https://music.youtube.com/search?q=${encodeURIComponent(song.t+' '+song.a)}`, '_blank');
      return;
    }
    const waitReady = () => new Promise(res => {
      if (ytReady) { res(); return; }
      let n = 0;
      const iv = setInterval(() => { if (ytReady || ++n > 50) { clearInterval(iv); res(); } }, 100);
    });
    await waitReady();
    if (ytReady) ytPlayer.loadVideoById(vid);
  } catch {
    document.getElementById('player-searching').classList.remove('on');
  }
}

function playNext() {
  if (!playlist.length) return;
  playIdx = (playIdx + 1) % playlist.length;
  playSong(playlist[playIdx]);
}
function playPrev() {
  if (!playlist.length) return;
  playIdx = (playIdx - 1 + playlist.length) % playlist.length;
  playSong(playlist[playIdx]);
}

document.getElementById('btn-play').addEventListener('click', () => { if (ytReady) isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); });
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-prev').addEventListener('click', playPrev);
document.getElementById('player-close').addEventListener('click', () => {
  if (ytReady) ytPlayer.stopVideo();
  document.getElementById('player-bar').classList.remove('open');
  playingTile = null;
});

// ═══════════════════════════════════════════
// iTunes 앨범 아트
// ═══════════════════════════════════════════
const artCache = {};
async function fetchArt(song) {
  const key = `${song.t}|${song.a}`;
  if (key in artCache) return artCache[key];
  artCache[key] = null;
  try {
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(song.t+' '+song.a)}&media=music&limit=1`);
    const d = await r.json();
    const url = d.results?.[0]?.artworkUrl100;
    artCache[key] = url ? url.replace('100x100bb','300x300bb') : null;
  } catch { artCache[key] = null; }
  return artCache[key];
}

// ═══════════════════════════════════════════
// Three.js
// ═══════════════════════════════════════════
let W = innerWidth, H = innerHeight;
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.z = 18;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, canvas: (() => {
  const c = document.createElement('canvas');
  c.id = 'three-canvas';
  document.body.appendChild(c);
  return c;
})() });
renderer.setClearColor(0x000000, 0);
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// 조명
const amb = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(amb);
const dirL = new THREE.DirectionalLight(0xffffff, 1.2);
dirL.position.set(5, 8, 10);
scene.add(dirL);

// 구 그룹
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);

// 내부 발광 구 (반사 느낌)
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R - 0.15, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x030018, roughness:0.6, metalness:0.4 })
);
sphereGroup.add(innerSphere);

// ═══════════════════════════════════════════
// Fibonacci 구 분포
// ═══════════════════════════════════════════
function fibPoints(n, r) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = golden * i;
    pts.push(new THREE.Vector3(Math.cos(theta) * rad * r, y * r, Math.sin(theta) * rad * r));
  }
  return pts;
}

// 노래 타일 텍스처 — 네온 유리 느낌 (1px 격자, 홀로그램 하이라이트)
function makeTileTexture(hex) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  // 격자 틈 (1px) = 거의 붙어있는 느낌
  ctx.fillStyle = '#00000a';
  ctx.fillRect(0, 0, 64, 64);
  // 메인 fill — 살짝 어둡게 (유리 속 색상)
  ctx.fillStyle = hex;
  ctx.globalAlpha = 0.65;
  ctx.fillRect(1, 1, 62, 62);
  ctx.globalAlpha = 1;
  // 유리 반사 하이라이트 (좌상단 밝게)
  const hi = ctx.createLinearGradient(1, 1, 35, 35);
  hi.addColorStop(0,   'rgba(255,255,255,0.5)');
  hi.addColorStop(0.25,'rgba(255,255,255,0.15)');
  hi.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = hi;
  ctx.fillRect(1, 1, 62, 62);
  // 네온 테두리 — 같은 색 밝게
  ctx.strokeStyle = hex;
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = 1;
  ctx.strokeRect(1.5, 1.5, 61, 61);
  ctx.globalAlpha = 1;
  return new THREE.CanvasTexture(cv);
}

// 빈 타일 텍스처 — 어두운 반투명 격자
function makeEmptyTileTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 16;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#020210';
  ctx.fillRect(0, 0, 16, 16);
  ctx.strokeStyle = 'rgba(80,80,150,0.18)';
  ctx.lineWidth = 0.6;
  ctx.strokeRect(0.8, 0.8, 14.4, 14.4);
  return new THREE.CanvasTexture(cv);
}

// ═══════════════════════════════════════════
// 디스코볼 빌드
// ═══════════════════════════════════════════
let tiles = [];
let playingTile = null;

// 타일 크기 계산: 전체 TOTAL_TILES 기준으로 촘촘하게
function calcTileSize() {
  const area = 4 * Math.PI * SPHERE_R * SPHERE_R;
  return Math.sqrt(area / TOTAL_TILES) * 0.97;  // 97% → 3% gap (1~2px)
}

function buildDisco(songs) {
  // 기존 타일 전부 제거
  for (const t of tiles) sphereGroup.remove(t);
  tiles = [];
  sphereGroup.children
    .filter(c => c !== innerSphere)
    .forEach(c => sphereGroup.remove(c));

  const n = songs.length;
  const total = Math.max(TOTAL_TILES, n);
  const allPoints = fibPoints(total, SPHERE_R);
  const tileSize  = calcTileSize();
  const geo = new THREE.PlaneGeometry(tileSize, tileSize);

  // ── 빈 타일 텍스처 (공유)
  const emptyTex = makeEmptyTileTexture();
  const emptyMat = new THREE.MeshStandardMaterial({
    map: emptyTex,
    transparent: true, opacity: 0.28,
    roughness: 0.15, metalness: 0.2,
    depthWrite: false,
  });

  // ── 장르 텍스처 캐시
  const texCache = {};

  // 노래 개수만큼 먼저 배치, 나머지는 빈 타일
  allPoints.forEach((pt, i) => {
    const normal = pt.clone().normalize();
    let mesh;

    if (i < n) {
      // ── 노래 타일 (네온 유리)
      const song = songs[i];
      const hex  = genreColor(song.g);
      if (!texCache[hex]) texCache[hex] = makeTileTexture(hex);
      const brightness = 0.45 + (((song.s ?? 7) - 1) / 9) * 0.85;
      const mat = new THREE.MeshStandardMaterial({
        map: texCache[hex],
        emissive: new THREE.Color(hex),
        emissiveIntensity: brightness,
        transparent: true, opacity: 0.82,
        roughness: 0.08, metalness: 0.25,
      });
      mesh = new THREE.Mesh(geo, mat);
      mesh.userData = {
        t: song.t, a: song.a, g: song.g,
        s: song.s ?? 7, d: song.d ?? '',
        normal, baseIntensity: brightness, popP: 0,
        isSong: true,
      };
      tiles.push(mesh);  // 인터랙션 대상
    } else {
      // ── 빈 타일 (어두운 격자)
      mesh = new THREE.Mesh(geo, emptyMat);
      mesh.userData = { normal, popP: 0, isSong: false };
    }

    mesh.position.copy(pt);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    sphereGroup.add(mesh);
  });

  // 플레이리스트 초기화
  playlist = songs.map(s => ({ t: s.t, a: s.a, g: s.g }));
  document.getElementById('count').textContent = `${n} TRACKS`;
}

// ═══════════════════════════════════════════
// 마우스 / 터치 회전
// ═══════════════════════════════════════════
let isDragging = false;
let prevMouse  = { x: 0, y: 0 };
let autoRotate = true;
let autoTimer  = null;
let targetQuat = null;  // 검색 시 자동 회전 목표
let velocity   = { x: 0, y: 0 };  // 드래그 관성

function resumeAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { autoRotate = true; }, 2500);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false; targetQuat = null;
  prevMouse = { x: e.clientX, y: e.clientY };
  velocity = { x: 0, y: 0 };
  resumeAuto();
});
window.addEventListener('mousemove', e => {
  if (!isDragging) { handleHover(e.clientX, e.clientY); return; }
  const dx = (e.clientX - prevMouse.x) * 0.006;
  const dy = (e.clientY - prevMouse.y) * 0.006;
  velocity = { x: dx, y: dy };
  sphereGroup.rotation.y += dx;
  sphereGroup.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, sphereGroup.rotation.x + dy));
  prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', e => {
  if (isDragging) {
    isDragging = false;
    handleClick(e.clientX, e.clientY);
  }
});

// 터치
renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  isDragging = true; autoRotate = false; targetQuat = null;
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  velocity = { x: 0, y: 0 };
  resumeAuto();
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = (e.touches[0].clientX - prevMouse.x) * 0.006;
  const dy = (e.touches[0].clientY - prevMouse.y) * 0.006;
  velocity = { x: dx, y: dy };
  sphereGroup.rotation.y += dx;
  sphereGroup.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, sphereGroup.rotation.x + dy));
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
window.addEventListener('touchend', e => { isDragging = false; resumeAuto(); });

// ═══════════════════════════════════════════
// 레이캐스터 (호버 / 클릭)
// ═══════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse2d   = new THREE.Vector2();
const tip = document.getElementById('tip');
let   hoveredTile = null;
let   didDrag = false;
let   mouseDownPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('mousedown', e => {
  mouseDownPos = { x: e.clientX, y: e.clientY };
  didDrag = false;
});
window.addEventListener('mousemove', e => {
  const dx = Math.abs(e.clientX - mouseDownPos.x);
  const dy = Math.abs(e.clientY - mouseDownPos.y);
  if (dx > 4 || dy > 4) didDrag = true;
});

function getRayHit(cx, cy) {
  mouse2d.x =  (cx / W) * 2 - 1;
  mouse2d.y = -(cy / H) * 2 + 1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(tiles);
  return hits.length ? hits[0].object : null;
}

function handleHover(cx, cy) {
  const hit = getRayHit(cx, cy);
  if (hit === hoveredTile) return;
  hoveredTile = hit;
  renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  if (!hit) { tip.style.opacity = '0'; return; }
  // 툴팁
  const ud = hit.userData;
  document.getElementById('tip-t').textContent = ud.t;
  document.getElementById('tip-a').textContent = ud.a;
  const gc = document.getElementById('tip-genre');
  gc.textContent = ud.g || '기타';
  const hex = genreColor(ud.g);
  gc.style.background = hex + '33';
  gc.style.color = hex;
  document.getElementById('tip-mood').textContent = ud.d ? `"${ud.d}"` : '';
  tip.style.opacity = '1';
  // 앨범 아트
  document.getElementById('tip-art-bg').style.background = `radial-gradient(circle, ${hex}55, transparent)`;
  const artEl = tip.querySelector('#tip-art img');
  if (artEl) artEl.remove();
  fetchArt({ t: ud.t, a: ud.a }).then(url => {
    if (!url || hoveredTile?.userData.t !== ud.t) return;
    const img = document.createElement('img');
    img.src = url;
    document.getElementById('tip-art').appendChild(img);
  });
  // 툴팁 위치
  positionTip(cx, cy);
}

function positionTip(cx, cy) {
  const tw = 210, th = 220;
  let lx = cx + 16, ly = cy - 30;
  if (lx + tw > W - 10) lx = cx - tw - 10;
  if (ly + th > H - 10) ly = H - th - 10;
  if (ly < 10) ly = 10;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
}

window.addEventListener('mousemove', e => {
  if (hoveredTile) positionTip(e.clientX, e.clientY);
});

function handleClick(cx, cy) {
  if (didDrag) return;
  const hit = getRayHit(cx, cy);
  if (!hit) return;
  const ud = hit.userData;
  if (playingTile === hit) return;  // 이미 재생 중
  playingTile = hit;
  playSong({ t: ud.t, a: ud.a, g: ud.g });
}

// ═══════════════════════════════════════════
// 검색
// ═══════════════════════════════════════════
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');

searchInput.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  searchClear.style.display = q ? 'block' : 'none';
  if (!q) {
    tiles.forEach(t => { t.material.emissiveIntensity = t.userData.baseIntensity; });
    targetQuat = null;
    return;
  }
  let bestTile = null;
  tiles.forEach(t => {
    const ud = t.userData;
    const match = ud.t.toLowerCase().includes(q) || ud.a.toLowerCase().includes(q);
    t.material.emissiveIntensity = match
      ? Math.max(ud.baseIntensity + 0.8, 1.5)
      : ud.baseIntensity * 0.25;
    if (match && !bestTile) bestTile = t;
  });
  // 해당 타일을 정면으로 자동 회전
  if (bestTile) {
    autoRotate = false;
    targetQuat = new THREE.Quaternion().setFromUnitVectors(
      bestTile.userData.normal,
      new THREE.Vector3(0, 0, 1)
    );
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  tiles.forEach(t => { t.material.emissiveIntensity = t.userData.baseIntensity; });
  targetQuat = null;
  autoRotate = true;
});

// ═══════════════════════════════════════════
// 날짜 히스토리
// ═══════════════════════════════════════════
function getDateStr(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toISOString().slice(0, 10);
}

async function loadAndSwitch(daysAgo) {
  const filename = daysAgo === 0 ? 'music.json' : `music_${getDateStr(daysAgo)}.json`;
  try {
    const r = await fetch(filename + '?t=' + Date.now());
    if (!r.ok) return false;
    const d = await r.json();
    if (!d.songs?.length) return false;
    buildDisco(d.songs);
    return true;
  } catch { return false; }
}

async function buildDateNav() {
  const nav = document.getElementById('date-nav');
  const labels = ['오늘','어제','2일 전','3일 전','4일 전','5일 전','6일 전'];
  let found = 0;
  for (let i = 0; i < 7; i++) {
    const filename = i === 0 ? 'music.json' : `music_${getDateStr(i)}.json`;
    try {
      const r = await fetch(filename, { method:'HEAD' });
      if (!r.ok) continue;
    } catch { continue; }
    found++;
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (i === 0 ? ' active' : '');
    btn.textContent = labels[i];
    btn.addEventListener('click', async () => {
      nav.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await loadAndSwitch(i);
    });
    nav.appendChild(btn);
  }
  if (found > 1) setTimeout(() => nav.classList.add('show'), 1200);
}

// ═══════════════════════════════════════════
// 렌더 루프
// ═══════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 자동 회전
  if (autoRotate && !isDragging) {
    sphereGroup.rotation.y += 0.0018;
  } else if (!isDragging) {
    // 드래그 관성
    velocity.x *= 0.93;
    velocity.y *= 0.93;
    sphereGroup.rotation.y += velocity.x;
    sphereGroup.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, sphereGroup.rotation.x + velocity.y));
  }

  // 검색 자동 정렬
  if (targetQuat && !isDragging) {
    sphereGroup.quaternion.slerp(targetQuat, 0.06);
    if (sphereGroup.quaternion.angleTo(targetQuat) < 0.01) targetQuat = null;
  }

  // 타일 pop-out 애니메이션
  for (const tile of tiles) {
    const ud = tile.userData;
    if (tile === playingTile) {
      ud.popP = Math.min(1, ud.popP + 0.05);
      // pulse glow
      tile.material.emissiveIntensity = ud.baseIntensity + Math.sin(t * 3.5) * 0.6 + 0.8;
    } else {
      ud.popP = Math.max(0, ud.popP - 0.05);
      // 검색 결과가 없을 때만 베이스 밝기로 복원
      if (!searchInput.value.trim()) {
        tile.material.emissiveIntensity = ud.baseIntensity;
      }
    }
    // 위치 업데이트 (구 표면 → 튀어나옴)
    tile.position.copy(ud.normal.clone().multiplyScalar(SPHERE_R + ud.popP * POP_OUT));
  }

  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════
// 리사이즈
// ═══════════════════════════════════════════
window.addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
async function init() {
  let songs = FALLBACK;
  try {
    const r = await fetch('music.json?t=' + Date.now());
    if (r.ok) {
      const d = await r.json();
      if (d.songs?.length) songs = d.songs;
    }
  } catch {}

  buildDisco(songs);
  buildDateNav();
  animate();

  document.getElementById('loading').style.display = 'none';
}
init();
</script>
