<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지금 뭐 듣지</title>
  <style>
    :root {
      --bg: #0a0a10;
      --fg: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.32);
      --border: rgba(255,255,255,0.07);
      --accent: #7c6fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Apple SD Gothic Neo', -apple-system, 'Noto Sans KR', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 1s cubic-bezier(.4,0,.2,1);
    }

    a { text-decoration: none; color: inherit; }

    /* ── 공통 레이아웃 ── */
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ── 상단 네비 ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 40px;
    }

    .nav-logo {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .nav-back {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--fg); }

    /* ── 랜딩 화면 ── */
    #screen-landing {
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .landing-inner {
      width: 100%;
      padding: 100px 0 80px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 36px;
      display: block;
    }

    .headline {
      font-size: clamp(40px, 7vw, 80px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 72px;
      word-break: keep-all;
    }
    .headline em {
      font-style: normal;
      color: var(--accent);
      transition: color 0.6s;
    }

    /* ── 바이브 리스트 ── */
    .vibe-list { list-style: none; }

    .vibe-item {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: gap 0.3s ease;
    }
    .vibe-item:first-child { border-top: 1px solid var(--border); }
    .vibe-item:hover { gap: 32px; }

    .vibe-num {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      width: 28px;
      flex-shrink: 0;
      transition: color 0.3s;
    }

    .vibe-text {
      flex: 1;
    }
    .vibe-name {
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    .vibe-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 400;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .vibe-item:hover .vibe-sub {
      opacity: 1;
      transform: translateY(0);
    }

    .vibe-arrow {
      font-size: 22px;
      color: var(--muted);
      transform: translateX(-12px);
      opacity: 0;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .vibe-item:hover .vibe-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── 로딩 화면 ── */
    #screen-loading {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    .loading-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
    }
    .loading-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── 플레이리스트 화면 ── */
    #screen-playlist {
      display: none;
      padding-top: 120px;
      padding-bottom: 100px;
      min-height: 100vh;
    }

    .pl-header {
      margin-bottom: 56px;
    }

    .pl-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: block;
    }

    .pl-title {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      word-break: keep-all;
    }

    .pl-desc {
      font-size: 14px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.7;
      max-width: 480px;
    }

    /* ── 트랙 리스트 ── */
    .track-list { list-style: none; margin-bottom: 60px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
    }
    .track-item:first-child { border-top: 1px solid var(--border); }
    .track-item:hover { background: rgba(255,255,255,0.04); }

    .track-num {
      font-size: 12px;
      color: var(--muted);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .track-why {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
      display: none;
    }
    .track-item:hover .track-why { display: block; }

    .track-play {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
      transition: all 0.2s;
    }
    .track-item:hover .track-play {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124,111,255,0.1);
    }

    /* ── 다시 고르기 버튼 ── */
    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 24px;
      cursor: pointer;
      transition: all 0.2s;
      background: none;
      text-transform: uppercase;
    }
    .reset-btn:hover {
      color: var(--fg);
      border-color: rgba(255,255,255,0.2);
    }

    /* ── 화면 전환 애니메이션 ── */
    .fade-in {
      animation: fadeUp 0.6s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .track-item {
      opacity: 0;
      animation: fadeUp 0.5s cubic-bezier(.4,0,.2,1) forwards;
    }
  </style>
</head>

// ──────────────────────────────────────
// 바이브 리스트 렌더링
// ──────────────────────────────────────
const vibeList = document.getElementById('vibe-list');
VIBES.forEach((v, i) => {
  const li = document.createElement('li');
  li.className = 'vibe-item';
  li.innerHTML = `
    <span class="vibe-num">0${i + 1}</span>
    <div class="vibe-text">
      <div class="vibe-name">${v.name}</div>
      <div class="vibe-sub">${v.sub}</div>
    </div>
    <span class="vibe-arrow">→</span>
  `;

  // 호버 시 강조색 변경
  li.addEventListener('mouseenter', () => {
    document.body.style.background = `linear-gradient(135deg, #0a0a10 60%, ${v.bgTint})`;
    document.getElementById('hl-em').style.color = v.accent;
    li.querySelector('.vibe-num').style.color = v.accent;
    li.querySelector('.vibe-name').style.color = v.accent;
  });
  li.addEventListener('mouseleave', () => {
    document.body.style.background = '';
    document.getElementById('hl-em').style.color = '';
    li.querySelector('.vibe-num').style.color = '';
    li.querySelector('.vibe-name').style.color = '';
  });

  li.addEventListener('click', () => selectVibe(v));
  vibeList.appendChild(li);
});

// ──────────────────────────────────────
// 바이브 선택 → 로딩 → 플레이리스트
// ──────────────────────────────────────
function selectVibe(vibe) {
  // 배경색 고정
  document.body.style.background = `linear-gradient(160deg, #0a0a10 55%, ${vibe.bgTint})`;
  document.documentElement.style.setProperty('--accent', vibe.accent);

  // 로딩 화면
  const landing = document.getElementById('screen-landing');
  const loading  = document.getElementById('screen-loading');
  const playlist = document.getElementById('screen-playlist');

  landing.style.display = 'none';
  loading.style.display = 'flex';

  document.getElementById('loading-label').textContent = `${vibe.name}에 맞는 노래 고르는 중`;

  // 1.8초 후 플레이리스트 표시
  setTimeout(() => {
    loading.style.display = 'none';
    buildPlaylist(vibe);
    playlist.style.display = 'block';
    window.scrollTo(0, 0);
  }, 1800);
}

// ──────────────────────────────────────
// 플레이리스트 빌드
// ──────────────────────────────────────
function buildPlaylist(vibe) {
  document.getElementById('pl-label').textContent = `AI Pick · ${vibe.name}`;
  document.getElementById('pl-title').textContent = vibe.plTitle;
  document.getElementById('pl-desc').textContent = vibe.plDesc;

  // 노래 셔플 → 상위 8개
  const pool = [...SONGS[vibe.id]];
  shuffle(pool);
  const picks = pool.slice(0, 8);

  const trackList = document.getElementById('track-list');
  trackList.innerHTML = '';

  picks.forEach((song, idx) => {
    const li = document.createElement('li');
    li.className = 'track-item';
    li.style.animationDelay = `${idx * 0.07}s`;
    li.innerHTML = `
      <span class="track-num">${String(idx + 1).padStart(2, '0')}</span>
      <div class="track-info">
        <div class="track-title">${song.t}</div>
        <div class="track-artist">${song.a}</div>
        <div class="track-why">${song.w}</div>
      </div>
      <div class="track-play">▶</div>
    `;
    li.addEventListener('click', () => {
      const q = encodeURIComponent(`${song.t} ${song.a}`);
      window.open(`https://music.youtube.com/search?q=${q}`, '_blank');
    });
    trackList.appendChild(li);
  });
}

// ──────────────────────────────────────
// 다시 고르기
// ──────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  document.body.style.background = '';
  document.documentElement.style.setProperty('--accent', '#7c6fff');
  document.getElementById('screen-playlist').style.display = 'none';
  document.getElementById('screen-landing').style.display = 'flex';
  window.scrollTo(0, 0);
});

// ──────────────────────────────────────
// 유틸
// ──────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
</script>
