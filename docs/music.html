<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Universe</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:'Apple SD Gothic Neo',-apple-system,'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; cursor:none; }

    #cur {
      position:fixed; width:10px; height:10px; border-radius:50%;
      background:rgba(255,255,255,.85); pointer-events:none; z-index:999;
      transform:translate(-50%,-50%);
      box-shadow:0 0 10px 3px rgba(255,255,255,.2);
      transition:width .15s,height .15s,background .2s;
    }
    #cur.hover { width:22px; height:22px; background:rgba(255,255,255,.25); }

    /* ── 모바일 ── */
    @media (pointer: coarse) {
      body { cursor: auto; }
      #cur { display: none; }
      #player-bar { height: 80px; padding: 0 16px; }
      .pc-btn { width: 44px; height: 44px; }
      .pc-btn.play-btn { width: 52px; height: 52px; font-size: 20px; }
      #player-title { font-size: 13px; }
    }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

    #top {
      position:absolute; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:28px 36px;
    }
    .logo-wrap { display:flex; flex-direction:column; gap:5px; }
    .logo { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.7); text-transform:uppercase; }
    .logo-sub { font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,.4); text-transform:uppercase; font-style:italic; }
    .back { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.5); text-decoration:none; pointer-events:all; transition:color .3s; }
    .back:hover { color:rgba(255,255,255,.9); }

    #date-badge {
      position:absolute; top:30px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.45); text-transform:uppercase;
    }

    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.5); white-space:nowrap;
      animation:hFade 12s ease-in-out forwards;
    }
    @keyframes hFade { 0%,60%{opacity:1} 100%{opacity:0} }

    #count {
      position:absolute; bottom:52px; right:36px;
      font-size:10px; letter-spacing:2px; color:rgba(255,255,255,.4);
    }

    #tip {
      position:fixed; z-index:50; padding:12px 18px;
      background:rgba(0,0,12,.9); border:1px solid rgba(255,255,255,.1);
      border-radius:16px; backdrop-filter:blur(20px);
      pointer-events:none; opacity:0; transition:opacity .2s;
    }
    #tip-t { font-size:14px; font-weight:600; color:rgba(255,255,255,.95); }
    #tip-a { font-size:11px; color:rgba(255,255,255,.35); margin-top:3px; }
    #tip-h { font-size:9px; color:rgba(255,255,255,.2); margin-top:8px; letter-spacing:2px; }

    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px; z-index:20;
      background:#000;
    }
    .ld-label { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.3); text-transform:uppercase; }
    .ld-dots { display:flex; gap:8px; }
    .ld-dots span { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5); animation:dp 1.4s ease-in-out infinite; }
    .ld-dots span:nth-child(2){ animation-delay:.2s; }
    .ld-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes dp { 0%,80%,100%{transform:scale(.5);opacity:.3} 40%{transform:scale(1);opacity:1} }

    /* ── 플레이어 바 ── */
    #player-bar {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      height:90px;
      background:rgba(4,4,18,0.95);
      border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(30px);
      display:flex; align-items:center; gap:16px;
      padding:0 24px;
      transform:translateY(100%);
      transition:transform .4s cubic-bezier(.4,0,.2,1);
      pointer-events:all;
    }
    #player-bar.open { transform:translateY(0); }

    #player-video {
      width:142px; height:80px; border-radius:8px;
      overflow:hidden; flex-shrink:0; position:relative;
      background:#000; cursor:pointer;
    }
    #player-video iframe { width:100%; height:100%; border:0; }
    #player-video .veil {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.35);
      font-size:22px; opacity:0; transition:opacity .2s;
    }
    #player-video:hover .veil { opacity:1; }

    #player-info { flex:1; min-width:0; }
    #player-title {
      font-size:15px; font-weight:600;
      color:rgba(255,255,255,.95);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    #player-artist {
      font-size:12px; color:rgba(255,255,255,.4); margin-top:4px;
    }
    #player-searching {
      font-size:11px; color:rgba(255,255,255,.25);
      letter-spacing:2px; margin-top:5px;
      display:none;
    }
    #player-searching.on { display:block; }

    #player-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .pc-btn {
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.7); font-size:15px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all .2s;
    }
    .pc-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .pc-btn.play-btn { width:48px; height:48px; font-size:18px; background:rgba(255,255,255,.12); }

    #player-close {
      width:32px; height:32px; border-radius:50%;
      background:transparent; border:none;
      color:rgba(255,255,255,.3); font-size:18px;
      cursor:pointer; transition:color .2s;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    #player-close:hover { color:rgba(255,255,255,.8); }

    /* ── NOW PLAYING 토스트 ── */
    #now-toast {
      position:fixed; top:82px; left:50%; transform:translateX(-50%) translateY(-12px);
      display:flex; align-items:center; gap:12px;
      background:rgba(5,5,22,0.93); border:1px solid rgba(255,255,255,.08);
      border-radius:50px; padding:10px 22px 10px 16px;
      backdrop-filter:blur(28px);
      opacity:0; transition:opacity .45s, transform .45s;
      pointer-events:none; z-index:200; white-space:nowrap;
    }
    #now-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #now-dot {
      width:7px; height:7px; border-radius:50%;
      background:rgba(140,190,255,.95);
      box-shadow:0 0 10px 3px rgba(140,190,255,.35);
      animation:nowPulse 1.1s ease-in-out infinite;
      flex-shrink:0;
    }
    @keyframes nowPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
    #now-label { font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,.25); text-transform:uppercase; margin-bottom:2px; }
    #now-title { font-size:13px; font-weight:600; color:rgba(255,255,255,.92); }
    #now-artist { font-size:10px; color:rgba(255,255,255,.35); margin-top:1px; }
  </style>
</head>

<div id="cur"></div>

<!-- ── 플레이어 바 ── -->
<div id="player-bar">
  <div id="player-video">
    <div id="yt-frame"></div>
    <div class="veil">▶</div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════════════════════════════════════
// YouTube 플레이어
// ═══════════════════════════════════════════════════
const YT_KEY = 'AIzaSyBGVbnH0iL_1unWWfktA6nrZMT29uSkOK0';
let ytPlayer   = null;
let ytReady    = false;
let playlist   = [];   // 현재 재생 큐 (song 배열)
let playIdx    = 0;
let isPlaying  = false;

// ── 뮤직 리액티브 ──
let musicEnergy = 0;   // 0(정지) → 1(재생), 부드럽게 lerp
let beatPhase   = 0;   // 비트 시뮬레이션 위상 (~120 BPM)

// YouTube API를 콜백 등록 후에 동적으로 로드 (타이밍 보장)
window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('yt-frame', {
    height: '80', width: '142',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        isPlaying = e.data === YT.PlayerState.PLAYING;
        document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
        if (e.data === YT.PlayerState.ENDED) playNext();
      },
    },
  });
};
const _yt = document.createElement('script');
_yt.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(_yt);

async function searchVideo(song) {
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_KEY}`;
  const r   = await fetch(url);
  const d   = await r.json();
  return d.items?.[0]?.id?.videoId ?? null;
}

function showNowPlaying(song) {
  document.getElementById('now-title').textContent  = song.t;
  document.getElementById('now-artist').textContent = song.a;
  const t = document.getElementById('now-toast');
  t.classList.add('show');
  clearTimeout(window._nowTimer);
  window._nowTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

async function playSong(song) {
  const bar  = document.getElementById('player-bar');
  const srch = document.getElementById('player-searching');
  document.getElementById('player-title').textContent  = song.t;
  document.getElementById('player-artist').textContent = song.a;
  srch.classList.add('on');
  bar.classList.add('open');
  showNowPlaying(song);

  try {
    const vid = await searchVideo(song);
    srch.classList.remove('on');
    if (!vid) {
      window.open(`https://music.youtube.com/search?q=${encodeURIComponent(song.t+' '+song.a)}`, '_blank');
      return;
    }
    // 플레이어 준비 대기 (최대 5초)
    const waitReady = () => new Promise(res => {
      if (ytReady) { res(); return; }
      let n = 0;
      const iv = setInterval(() => {
        if (ytReady || ++n > 50) { clearInterval(iv); res(); }
      }, 100);
    });
    await waitReady();
    if (ytReady) ytPlayer.loadVideoById(vid);
  } catch {
    srch.classList.remove('on');
  }
}

function playNext() {
  if (!playlist.length) return;
  playIdx = (playIdx + 1) % playlist.length;
  playSong(playlist[playIdx]);
}
function playPrev() {
  if (!playlist.length) return;
  playIdx = (playIdx - 1 + playlist.length) % playlist.length;
  playSong(playlist[playIdx]);
}

// 컨트롤 버튼
document.getElementById('btn-play').addEventListener('click', () => {
  if (!ytReady) return;
  isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
});
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-prev').addEventListener('click', playPrev);
document.getElementById('player-close').addEventListener('click', () => {
  if (ytReady) ytPlayer.stopVideo();
  document.getElementById('player-bar').classList.remove('open');
});
// 비디오 클릭 → YouTube에서 열기
document.getElementById('player-video').addEventListener('click', e => {
  if (e.target.closest('.veil') && playlist[playIdx]) {
    const q = encodeURIComponent(`${playlist[playIdx].t} ${playlist[playIdx].a}`);
    window.open(`https://music.youtube.com/search?q=${q}`, '_blank');
  }
});

// ═══════════════════════════════════════════════════
// 폴백 데이터
// ═══════════════════════════════════════════════════
const FALLBACK = [
  {t:'Supernova',a:'aespa'},{t:'Drama',a:'aespa'},{t:'Spicy',a:'aespa'},
  {t:'APT.',a:'ROSÉ & Bruno Mars'},{t:'Number One Girl',a:'ROSÉ'},
  {t:'Attention',a:'NewJeans'},{t:'Ditto',a:'NewJeans'},{t:'Hype Boy',a:'NewJeans'},{t:'GODS',a:'NewJeans'},
  {t:'Magnetic',a:'ILLIT'},{t:'Lucky Girl Syndrome',a:'ILLIT'},
  {t:'Love Dive',a:'IVE'},{t:'After LIKE',a:'IVE'},{t:'Baddie',a:'IVE'},
  {t:'Queencard',a:'(G)I-DLE'},{t:'Nxde',a:'(G)I-DLE'},{t:'Tomboy',a:'(G)I-DLE'},
  {t:'Pink Venom',a:'BLACKPINK'},{t:'How You Like That',a:'BLACKPINK'},
  {t:'Dynamite',a:'BTS'},{t:'Butter',a:'BTS'},{t:'봄날',a:'BTS'},
  {t:'Celebrity',a:'IU'},{t:'밤편지',a:'IU'},{t:'좋은 날',a:'IU'},
  {t:'주저하는 연인들을 위해',a:'잔나비'},{t:'전설',a:'잔나비'},
  {t:'Rain and You',a:'크러쉬'},{t:'Beautiful',a:'크러쉬'},

  {t:'Levitating',a:'Dua Lipa'},{t:"Don't Start Now",a:'Dua Lipa'},{t:'Physical',a:'Dua Lipa'},
  {t:'24K Magic',a:'Bruno Mars'},{t:'Uptown Funk',a:'Bruno Mars'},
  {t:'Espresso',a:'Sabrina Carpenter'},{t:'Please Please Please',a:'Sabrina Carpenter'},
  {t:'Birds of a Feather',a:'Billie Eilish'},{t:'lovely',a:'Billie Eilish & Khalid'},

  {t:'The Night We Met',a:'Lord Huron'},{t:'Holocene',a:'Bon Iver'},
  {t:'As It Was',a:'Harry Styles'},{t:'Watermelon Sugar',a:'Harry Styles'},
  {t:'Stay',a:'The Kid LAROI'},{t:'Flowers',a:'Miley Cyrus'},

];

// ═══════════════════════════════════════════════════
// 기본 설정
// ═══════════════════════════════════════════════════
let W = innerWidth, H = innerHeight;
let mouseX = 0, mouseY = 0;
let hovered = null;
const cur  = document.getElementById('cur');
const tip  = document.getElementById('tip');

// ═══════════════════════════════════════════════════
// Scene / Camera / Renderer
// ═══════════════════════════════════════════════════
const scene    = new THREE.Scene();
scene.fog      = new THREE.FogExp2(0x000008, 0.0011);
scene.background = new THREE.Color(0x000008);

// 은하 전체를 담는 그룹 (다축 회전 구현용)
const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

const camera = new THREE.PerspectiveCamera(55, W/H, 0.1, 3000);
camera.position.set(0, 50, 300);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  composer.setSize(W, H);
});

// ═══════════════════════════════════════════════════
// 블룸 후처리
// ═══════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.6, 0.7, 0.08);
composer.addPass(bloom);

// ═══════════════════════════════════════════════════
// OrbitControls
// ═══════════════════════════════════════════════════
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.04;
controls.autoRotate       = true;
controls.autoRotateSpeed  = 0.2;
controls.minDistance      = 60;
controls.maxDistance      = 600;
controls.enablePan        = false;

// 드래그 시작하면 자동회전 멈춤, 8초 후 재개
let autoRotateTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(autoRotateTimer);
});
controls.addEventListener('end', () => {
  autoRotateTimer = setTimeout(() => { controls.autoRotate = true; }, 8000);
});

// ═══════════════════════════════════════════════════
// 별 배경 (다층 + 색상 다양 + 은하수 띠)
// ═══════════════════════════════════════════════════
(function buildStars() {
  // ── 1. 미세한 별 12,000개 (색상 다양) ──
  {
    const N = 12000;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    // 별 색: 청백(O형), 하얀(A형), 노랑(태양), 주황(K형), 붉은(적색거성)
    const palette = [
      [0.7,0.82,1.0],[0.95,0.95,1.0],[1.0,1.0,0.82],[1.0,0.78,0.55],[1.0,0.52,0.38]
    ];
    for (let i = 0; i < N; i++) {
      pos[i*3]=(Math.random()-.5)*3000; pos[i*3+1]=(Math.random()-.5)*3000; pos[i*3+2]=(Math.random()-.5)*3000;
      const c = palette[Math.floor(Math.random()*palette.length)];
      const b = 0.35 + Math.random()*0.65;
      col[i*3]=c[0]*b; col[i*3+1]=c[1]*b; col[i*3+2]=c[2]*b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:0.5, vertexColors:true, transparent:true, opacity:0.85,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
  // ── 2. 밝은 별 700개 (bloom 반응) ──
  {
    const N = 700;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      pos[i*3]=(Math.random()-.5)*2800; pos[i*3+1]=(Math.random()-.5)*2800; pos[i*3+2]=(Math.random()-.5)*2800;
      const t = Math.random();
      col[i*3]=0.88+t*0.12; col[i*3+1]=0.9+t*0.1; col[i*3+2]=1.0;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:1.6, vertexColors:true, transparent:true, opacity:0.9,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
  // ── 3. 은하수 띠 (기울어진 원반 형태) ──
  {
    const N = 7000;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    const TILT = Math.PI / 5.5;
    for (let i = 0; i < N; i++) {
      const angle  = Math.random() * Math.PI * 2;
      const r      = 350 + Math.random() * 1000;
      const spread = (Math.random() - .5) * 140;
      pos[i*3]   = Math.cos(angle) * r;
      pos[i*3+1] = spread * Math.cos(TILT) + Math.sin(angle) * r * Math.sin(TILT) * 0.18;
      pos[i*3+2] = Math.sin(angle) * r      + spread * Math.sin(TILT) * 0.28;
      const b = 0.15 + Math.random() * 0.45;
      col[i*3]=b*0.88; col[i*3+1]=b*0.84; col[i*3+2]=b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:0.42, vertexColors:true, transparent:true, opacity:0.5,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
})();

// ═══════════════════════════════════════════════════
// 성운 (Nebulae) — 배경 컬러 클라우드
// ═══════════════════════════════════════════════════
const nebulae = [];
function buildNebulae() {
  const configs = [
    { hue:210, x:-850, y: 280, z:-550, size:820 },
    { hue:275, x: 650, y:-320, z:-780, size:700 },
    { hue:330, x:-420, y:-480, z: 720, size:650 },
    { hue:185, x: 880, y: 380, z: 320, size:760 },
    { hue: 35, x: 180, y: 680, z:-680, size:580 },
    { hue:250, x:-720, y: 560, z: 520, size:700 },
    { hue:160, x: 300, y:-650, z:-400, size:540 },
  ];
  configs.forEach(cfg => {
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = 256;
    const ctx = cvs.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,    `hsla(${cfg.hue},80%,65%,0.45)`);
    g.addColorStop(0.38, `hsla(${cfg.hue},70%,50%,0.2)`);
    g.addColorStop(0.72, `hsla(${cfg.hue},60%,40%,0.06)`);
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cvs),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
    }));
    spr.position.set(cfg.x, cfg.y, cfg.z);
    spr.scale.setScalar(cfg.size);
    spr.userData.baseOp = 0.1 + Math.random()*0.08;
    spr.userData.phase  = Math.random() * Math.PI * 2;
    spr.material.opacity = spr.userData.baseOp;
    scene.add(spr);
    nebulae.push(spr);
  });
}

// ═══════════════════════════════════════════════════
// 지구 (Earth)
// ═══════════════════════════════════════════════════
let earthGroup = null;

function makeEarthTex() {
  const S = 1024;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = S;
  const ctx = cvs.getContext('2d');
  // 해양
  ctx.fillStyle = '#0f2d58'; ctx.fillRect(0,0,S,S);
  const og = ctx.createLinearGradient(0,0,S,S);
  og.addColorStop(0,'rgba(8,22,55,0.5)'); og.addColorStop(0.5,'rgba(18,52,105,0.25)'); og.addColorStop(1,'rgba(4,15,40,0.5)');
  ctx.fillStyle=og; ctx.fillRect(0,0,S,S);
  // 대륙 helper
  function land(cx,cy,rx,ry,rot,base,hi){
    ctx.save(); ctx.translate(cx*S,cy*S); ctx.rotate(rot);
    ctx.fillStyle=base; ctx.beginPath(); ctx.ellipse(0,0,rx*S,ry*S,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=hi;   ctx.beginPath(); ctx.ellipse(-rx*S*.08,-ry*S*.1,rx*S*.58,ry*S*.52,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  land(0.18,0.30, 0.08,0.13, 0.35, '#26531f','#337a2a');  // 북미
  land(0.23,0.62, 0.055,0.12,-0.15,'#265020','#317528');  // 남미
  land(0.47,0.28, 0.038,0.07, 0.1, '#284f22','#35732c');  // 유럽
  land(0.50,0.58, 0.065,0.13, 0.05,'#2b5421','#387030');  // 아프리카
  land(0.64,0.34, 0.13,0.11, -0.2,'#274e21','#33692c');   // 아시아
  land(0.73,0.65, 0.052,0.052, 0.3,'#285022','#34702e');  // 호주
  land(0.25,0.13, 0.032,0.046, 0.0,'#bcd4c8','#d2eae2');  // 그린란드
  // 북극
  const np=ctx.createRadialGradient(S/2,0,0,S/2,0,S*0.14);
  np.addColorStop(0,'rgba(218,232,255,1)'); np.addColorStop(0.65,'rgba(200,218,252,0.65)'); np.addColorStop(1,'rgba(180,200,248,0)');
  ctx.fillStyle=np; ctx.fillRect(0,0,S,S*0.16);
  // 남극
  const sp=ctx.createRadialGradient(S/2,S,0,S/2,S,S*0.12);
  sp.addColorStop(0,'rgba(228,238,255,1)'); sp.addColorStop(0.65,'rgba(208,222,255,0.55)'); sp.addColorStop(1,'rgba(190,208,255,0)');
  ctx.fillStyle=sp; ctx.fillRect(0,S*0.86,S,S*0.14);
  return new THREE.CanvasTexture(cvs);
}

function buildEarth() {
  earthGroup = new THREE.Group();
  // 지구 구체
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(62, 64, 32),
    new THREE.MeshPhongMaterial({ map:makeEarthTex(), shininess:18, specular:new THREE.Color(0x1a3a66) })
  );
  earthGroup.add(earth);
  // 구름 레이어
  const cloudCvs = document.createElement('canvas');
  cloudCvs.width = cloudCvs.height = 512;
  const cctx = cloudCvs.getContext('2d');
  cctx.fillStyle='rgba(0,0,0,0)'; cctx.fillRect(0,0,512,512);
  for (let i=0;i<60;i++){
    const cx=Math.random()*512,cy=Math.random()*512,rx=20+Math.random()*55,ry=8+Math.random()*22;
    const g=cctx.createRadialGradient(cx,cy,0,cx,cy,rx);
    g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
    cctx.fillStyle=g; cctx.beginPath(); cctx.ellipse(cx,cy,rx,ry,Math.random()*Math.PI,0,Math.PI*2); cctx.fill();
  }
  const cloud = new THREE.Mesh(
    new THREE.SphereGeometry(63.5, 64, 32),
    new THREE.MeshPhongMaterial({ map:new THREE.CanvasTexture(cloudCvs), transparent:true, opacity:0.38, depthWrite:false })
  );
  earthGroup.add(cloud);
  // 대기권 글로우
  const atm = new THREE.Mesh(
    new THREE.SphereGeometry(67, 32, 16),
    new THREE.MeshPhongMaterial({ color:new THREE.Color(0x3366bb), transparent:true, opacity:0.1, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  earthGroup.add(atm);

  earthGroup.position.set(-380, -100, -260);
  earthGroup.rotation.z = 0.41;  // 지축 기울기
  scene.add(earthGroup);

  // 지구용 조명
  const sun = new THREE.DirectionalLight(0xfff8ee, 1.1);
  sun.position.set(2, 0.6, 1.5);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x0d1a33, 0.8));
}

// ═══════════════════════════════════════════════════
// 별똥별 (Shooting Star)
// ═══════════════════════════════════════════════════
let shootMesh, shootTimer = 420;
let shootProgress = -1, shootStart = new THREE.Vector3(), shootDir = new THREE.Vector3();

function initShootStar() {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  shootMesh = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color:0xffffff, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, linewidth:2,
  }));
  scene.add(shootMesh);
}

// ═══════════════════════════════════════════════════
// 노드 텍스처 캐시
// ═══════════════════════════════════════════════════
const texCache = {};
function getNodeTex(hue) {
  if (texCache[hue]) return texCache[hue];
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 256;
  const c = cvs.getContext('2d');
  const g = c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.12, `hsla(${hue},95%,85%,0.95)`);
  g.addColorStop(0.40, `hsla(${hue},85%,60%,0.5)`);
  g.addColorStop(0.75, `hsla(${hue},70%,40%,0.15)`);
  g.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  texCache[hue] = new THREE.CanvasTexture(cvs);
  return texCache[hue];
}

// ═══════════════════════════════════════════════════
// 노래 노드 + 콘스텔레이션
// ═══════════════════════════════════════════════════
const sprites   = [];
let linesMesh   = null;

function buildGalaxy(songs) {
  sprites.forEach(s => galaxyGroup.remove(s));
  sprites.length = 0;
  if (linesMesh) galaxyGroup.remove(linesMesh);

  const n = songs.length;
  songs.forEach((song, i) => {
    // 완전 3D 구형 랜덤 배치 (매 접속마다 다름)
    // pow(random, 0.55) → 중심부 조금 더 밀집, 외곽으로 퍼짐
    const r     = 25 + Math.pow(Math.random(), 0.55) * 155;
    const theta = Math.random() * Math.PI * 2;          // 수평각 0~360°
    const phi   = Math.acos(2 * Math.random() - 1);     // 수직각 균등 분포

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    // hue: 보라→파→시안→초록→노랑→주황→분홍 순환 (트롯 느낌의 붉은 계열 최소화)
    const hue = Math.round(200 + (i/n)*300) % 360;

    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getNodeTex(hue),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    }));
    spr.position.set(x, y, z);
    spr.scale.setScalar(13);
    spr.userData = { t: song.t, a: song.a, hue, base: 13 };

    galaxyGroup.add(spr);
    sprites.push(spr);
  });

  // 콘스텔레이션 라인
  const pts = [], cls = [];
  for (let i = 0; i < sprites.length; i++) {
    for (let j = i+1; j < sprites.length; j++) {
      const d = sprites[i].position.distanceTo(sprites[j].position);
      if (d < 88) {
        const a = (1 - d/88) * 0.55;
        const c1 = new THREE.Color().setHSL(sprites[i].userData.hue/360, .8, .6);
        const c2 = new THREE.Color().setHSL(sprites[j].userData.hue/360, .8, .6);
        pts.push(...sprites[i].position.toArray(), ...sprites[j].position.toArray());
        cls.push(c1.r*a,c1.g*a,c1.b*a, c2.r*a,c2.g*a,c2.b*a);
      }
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  lg.setAttribute('color',    new THREE.Float32BufferAttribute(cls, 3));
  linesMesh = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  galaxyGroup.add(linesMesh);

  document.getElementById('count').textContent = `${n} SONGS`;
}

// ═══════════════════════════════════════════════════
// 마우스 / 레이캐스터
// ═══════════════════════════════════════════════════
const ray   = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
ray.params.Sprite = { threshold: isMobile ? 18 : 10 };

window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
  mouse.x =  (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
});

// ── 데스크탑 클릭 ──
window.addEventListener('click', () => {
  if (!hovered) return;
  const idx = sprites.indexOf(hovered);
  playlist = [...sprites.slice(idx), ...sprites.slice(0, idx)]
    .map(s => ({ t: s.userData.t, a: s.userData.a }));
  playIdx = 0;
  playSong(playlist[0]);
});

// ── 모바일 터치 ──
let _tx = 0, _ty = 0;
window.addEventListener('touchstart', e => {
  const t = e.touches[0];
  _tx = t.clientX; _ty = t.clientY;
  mouse.x =  (t.clientX / W) * 2 - 1;
  mouse.y = -(t.clientY / H) * 2 + 1;
  mouseX = t.clientX; mouseY = t.clientY;
}, { passive: true });

window.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - _tx, dy = t.clientY - _ty;
  if (dx*dx + dy*dy > 144) return;   // 12px 이상 드래그면 무시

  mouse.x =  (t.clientX / W) * 2 - 1;
  mouse.y = -(t.clientY / H) * 2 + 1;

  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(sprites);
  if (!hits.length) return;

  const s = hits[0].object;
  const idx = sprites.indexOf(s);
  playlist = [...sprites.slice(idx), ...sprites.slice(0, idx)]
    .map(sp => ({ t: sp.userData.t, a: sp.userData.a }));
  playIdx = 0;
  playSong(playlist[0]);
}, { passive: true });

// ═══════════════════════════════════════════════════
// 애니메이션 루프
// ═══════════════════════════════════════════════════
let tick = 0;
function animate() {
  requestAnimationFrame(animate);
  tick++;

  // ── 뮤직 에너지 lerp ──
  musicEnergy += ((isPlaying ? 1 : 0) - musicEnergy) * 0.035;

  // 비트 시뮬레이션 ~120 BPM (60fps 기준 0.0333 * 2π rad/frame)
  beatPhase += 0.0333 * Math.PI * 2;
  // beat: 0~1 단방향 펄스 (음악 재생 중일 때만)
  const beat = musicEnergy * Math.max(0, Math.sin(beatPhase)) ** 2;

  // ── 회전 방향·속도: 사인파로 자연스럽게 방향 전환 (~3분 주기) ──
  const rotDir = Math.sin(tick * 0.00055);  // -1 ~ +1, 약 190초 주기
  controls.autoRotateSpeed = rotDir * (0.45 + musicEnergy * 1.8);

  // ── 은하 그룹 다축 틸트: 천천히 앞뒤·좌우로 기울어짐 ──
  galaxyGroup.rotation.x = Math.sin(tick * 0.00038) * 0.28;
  galaxyGroup.rotation.z = Math.sin(tick * 0.00027) * 0.14;

  // ── 블룸: 정지 1.6 → 재생 평균 2.4 → 비트 피크 3.2 ──
  bloom.strength = 1.6 + musicEnergy * 0.8 + beat * 0.8;

  // ── 지구 자전 ──
  if (earthGroup) earthGroup.rotation.y += 0.0008;

  // ── 성운 숨쉬기 ──
  nebulae.forEach(n => {
    n.userData.phase += 0.004;
    n.material.opacity = n.userData.baseOp + Math.sin(n.userData.phase) * 0.035;
  });

  // ── 별똥별 ──
  if (--shootTimer <= 0) {
    shootTimer = 480 + Math.random() * 660;
    shootStart.set((Math.random()-.5)*1600, 280+Math.random()*380, (Math.random()-.5)*900);
    shootDir.set((Math.random()-.5)*1.2, -1-Math.random()*.8, (Math.random()-.5)*.6).normalize();
    shootProgress = 0;
  }
  if (shootProgress >= 0) {
    shootProgress += 2.8;
    const head = shootStart.clone().addScaledVector(shootDir, shootProgress);
    const tail = shootStart.clone().addScaledVector(shootDir, Math.max(0, shootProgress - 90));
    const arr = shootMesh.geometry.attributes.position.array;
    head.toArray(arr, 0); tail.toArray(arr, 3);
    shootMesh.geometry.attributes.position.needsUpdate = true;
    shootMesh.material.opacity = Math.sin(Math.min(shootProgress/180, 1) * Math.PI) * 0.85;
    if (shootProgress > 200) { shootProgress = -1; shootMesh.material.opacity = 0; }
  }

  controls.update();

  // 호버 감지
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(sprites);

  const newHov = hits.length ? hits[0].object : null;
  if (newHov !== hovered) {
    if (hovered) {
      hovered.scale.setScalar(hovered.userData.base);
      tip.style.opacity = '0';
      cur.classList.remove('hover');
    }
    hovered = newHov;
    if (hovered) {
      cur.classList.add('hover');
      document.getElementById('tip-t').textContent = hovered.userData.t;
      document.getElementById('tip-a').textContent = hovered.userData.a;
    }
  }

  // 호버 노드 확대 + 툴팁
  if (hovered) {
    const pulse = Math.sin(tick * .1) * 2;
    hovered.scale.setScalar(hovered.userData.base * 2.2 + pulse);

    let tx = mouseX + 20, ty = mouseY - 10;
    if (tx + 210 > W) tx = mouseX - 225;
    if (ty + 85  > H) ty = mouseY - 95;
    tip.style.left = tx + 'px';
    tip.style.top  = ty + 'px';
    tip.style.opacity = '1';
  }

  // ── 모든 노드 숨쉬기 (음악 에너지 반영) ──
  sprites.forEach((s, i) => {
    if (s === hovered) return;
    // 정지: 느린 잔잔한 숨쉬기 / 재생: 빠르고 큰 맥동 + 비트 리액션
    const calmPulse     = Math.sin(tick * .022 + i * .45) * 1.5;
    const energyPulse   = Math.sin(tick * .075 + i * .45) * (2.5 + beat * 6);
    const combinedPulse = calmPulse * (1 - musicEnergy) + energyPulse * musicEnergy;
    s.scale.setScalar(s.userData.base + combinedPulse);
  });

  composer.render();
}

// ═══════════════════════════════════════════════════
// 데이터 로드 & 시작
// ═══════════════════════════════════════════════════
async function init() {
  let songs = FALLBACK;
  try {
    const r = await fetch('music.json?t=' + Date.now());
    if (r.ok) {
      const d = await r.json();
      if (d.songs?.length) {
        songs = d.songs;
        if (d.updated)
          document.getElementById('date-badge').textContent = `AI PICKS · ${d.updated}`;
      }
    }
  } catch {}

  buildNebulae();
  buildEarth();
  initShootStar();
  buildGalaxy(songs);

  // 로딩 화면 제거
  const ld = document.getElementById('loading');
  ld.style.transition = 'opacity .8s';
  ld.style.opacity = '0';
  setTimeout(() => ld.remove(), 800);

  animate();
}

init();
</script>
