<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Universe</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:'Apple SD Gothic Neo',-apple-system,'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; cursor:none; }

    #cur {
      position:fixed; width:10px; height:10px; border-radius:50%;
      background:rgba(255,255,255,.85); pointer-events:none; z-index:999;
      transform:translate(-50%,-50%);
      box-shadow:0 0 10px 3px rgba(255,255,255,.2);
      transition:width .15s,height .15s,background .2s;
    }
    #cur.hover { width:22px; height:22px; background:rgba(255,255,255,.25); }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

    #top {
      position:absolute; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:28px 36px;
    }
    .logo { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.18); text-transform:uppercase; }
    .back { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.18); text-decoration:none; pointer-events:all; transition:color .3s; }
    .back:hover { color:rgba(255,255,255,.7); }

    #date-badge {
      position:absolute; top:30px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.18); text-transform:uppercase;
    }

    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.2); white-space:nowrap;
      animation:hFade 12s ease-in-out forwards;
    }
    @keyframes hFade { 0%,60%{opacity:1} 100%{opacity:0} }

    #count {
      position:absolute; bottom:52px; right:36px;
      font-size:10px; letter-spacing:2px; color:rgba(255,255,255,.12);
    }

    #tip {
      position:fixed; z-index:50; padding:12px 18px;
      background:rgba(0,0,12,.9); border:1px solid rgba(255,255,255,.1);
      border-radius:16px; backdrop-filter:blur(20px);
      pointer-events:none; opacity:0; transition:opacity .2s;
    }
    #tip-t { font-size:14px; font-weight:600; color:rgba(255,255,255,.95); }
    #tip-a { font-size:11px; color:rgba(255,255,255,.35); margin-top:3px; }
    #tip-h { font-size:9px; color:rgba(255,255,255,.2); margin-top:8px; letter-spacing:2px; }

    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px; z-index:20;
      background:#000;
    }
    .ld-label { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.3); text-transform:uppercase; }
    .ld-dots { display:flex; gap:8px; }
    .ld-dots span { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5); animation:dp 1.4s ease-in-out infinite; }
    .ld-dots span:nth-child(2){ animation-delay:.2s; }
    .ld-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes dp { 0%,80%,100%{transform:scale(.5);opacity:.3} 40%{transform:scale(1);opacity:1} }

    /* ── 플레이어 바 ── */
    #player-bar {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      height:90px;
      background:rgba(4,4,18,0.95);
      border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(30px);
      display:flex; align-items:center; gap:16px;
      padding:0 24px;
      transform:translateY(100%);
      transition:transform .4s cubic-bezier(.4,0,.2,1);
      pointer-events:all;
    }
    #player-bar.open { transform:translateY(0); }

    #player-video {
      width:142px; height:80px; border-radius:8px;
      overflow:hidden; flex-shrink:0; position:relative;
      background:#000; cursor:pointer;
    }
    #player-video iframe { width:100%; height:100%; border:0; }
    #player-video .veil {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.35);
      font-size:22px; opacity:0; transition:opacity .2s;
    }
    #player-video:hover .veil { opacity:1; }

    #player-info { flex:1; min-width:0; }
    #player-title {
      font-size:15px; font-weight:600;
      color:rgba(255,255,255,.95);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    #player-artist {
      font-size:12px; color:rgba(255,255,255,.4); margin-top:4px;
    }
    #player-searching {
      font-size:11px; color:rgba(255,255,255,.25);
      letter-spacing:2px; margin-top:5px;
      display:none;
    }
    #player-searching.on { display:block; }

    #player-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .pc-btn {
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.7); font-size:15px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all .2s;
    }
    .pc-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .pc-btn.play-btn { width:48px; height:48px; font-size:18px; background:rgba(255,255,255,.12); }

    #player-close {
      width:32px; height:32px; border-radius:50%;
      background:transparent; border:none;
      color:rgba(255,255,255,.3); font-size:18px;
      cursor:pointer; transition:color .2s;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    #player-close:hover { color:rgba(255,255,255,.8); }
  </style>

const YT_KEY = 'AIzaSyBGVbnH0iL_1unWWfktA6nrZMT29uSkOK0';
let ytPlayer   = null;
let ytReady    = false;
let playlist   = [];   // 현재 재생 큐 (song 배열)
let playIdx    = 0;
let isPlaying  = false;

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('yt-frame', {
    height: '80', width: '142',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        isPlaying = e.data === YT.PlayerState.PLAYING;
        document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
        if (e.data === YT.PlayerState.ENDED) playNext();
      },
    },
  });
};

async function searchVideo(song) {
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_KEY}`;
  const r   = await fetch(url);
  const d   = await r.json();
  return d.items?.[0]?.id?.videoId ?? null;
}

async function playSong(song) {
  const bar  = document.getElementById('player-bar');
  const srch = document.getElementById('player-searching');
  document.getElementById('player-title').textContent  = song.t;
  document.getElementById('player-artist').textContent = song.a;
  srch.classList.add('on');
  bar.classList.add('open');

  try {
    const vid = await searchVideo(song);
    srch.classList.remove('on');
    if (vid && ytReady) {
      ytPlayer.loadVideoById(vid);
    } else if (!vid) {
      // 검색 결과 없으면 YouTube Music으로
      window.open(`https://music.youtube.com/search?q=${encodeURIComponent(song.t+' '+song.a)}`, '_blank');
    }
  } catch {
    srch.classList.remove('on');
  }
}

function playNext() {
  if (!playlist.length) return;
  playIdx = (playIdx + 1) % playlist.length;
  playSong(playlist[playIdx]);
}
function playPrev() {
  if (!playlist.length) return;
  playIdx = (playIdx - 1 + playlist.length) % playlist.length;
  playSong(playlist[playIdx]);
}

// 컨트롤 버튼
document.getElementById('btn-play').addEventListener('click', () => {
  if (!ytReady) return;
  isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
});
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-prev').addEventListener('click', playPrev);
document.getElementById('player-close').addEventListener('click', () => {
  if (ytReady) ytPlayer.stopVideo();
  document.getElementById('player-bar').classList.remove('open');
});
// 비디오 클릭 → YouTube에서 열기
document.getElementById('player-video').addEventListener('click', e => {

    const q = encodeURIComponent(`${playlist[playIdx].t} ${playlist[playIdx].a}`);
    window.open(`https://music.youtube.com/search?q=${q}`, '_blank');
  }
});

// ═══════════════════════════════════════════════════
// 기본 설정

let W = innerWidth, H = innerHeight;
let mouseX = 0, mouseY = 0;
let hovered = null;
const cur  = document.getElementById('cur');
const tip  = document.getElementById('tip');

// ═══════════════════════════════════════════════════
// Scene / Camera / Renderer
// ═══════════════════════════════════════════════════
const scene    = new THREE.Scene();
scene.fog      = new THREE.FogExp2(0x000008, 0.0018);
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(55, W/H, 0.1, 3000);
camera.position.set(0, 50, 300);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  composer.setSize(W, H);
});

// ═══════════════════════════════════════════════════
// 블룸 후처리
// ═══════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.6, 0.7, 0.08);
composer.addPass(bloom);

// ═══════════════════════════════════════════════════
// OrbitControls
// ═══════════════════════════════════════════════════
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.04;
controls.autoRotate       = true;
controls.autoRotateSpeed  = 0.2;
controls.minDistance      = 60;
controls.maxDistance      = 600;
controls.enablePan        = false;

// 드래그 시작하면 자동회전 멈춤, 8초 후 재개
let autoRotateTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(autoRotateTimer);
});
controls.addEventListener('end', () => {
  autoRotateTimer = setTimeout(() => { controls.autoRotate = true; }, 8000);
});

// ═══════════════════════════════════════════════════
// 별 배경
// ═══════════════════════════════════════════════════
(function buildStars() {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(5000 * 3);
  const col = new Float32Array(5000 * 3);
  for (let i = 0; i < 5000; i++) {
    pos[i*3]   = (Math.random()-.5)*2400;
    pos[i*3+1] = (Math.random()-.5)*2400;
    pos[i*3+2] = (Math.random()-.5)*2400;
    const t = Math.random();
    col[i*3]   = 0.7 + t*0.3;
    col[i*3+1] = 0.75 + t*0.25;
    col[i*3+2] = 1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.55, vertexColors: true,
    transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false,
  })));
})();

// ═══════════════════════════════════════════════════
// 노드 텍스처 캐시
// ═══════════════════════════════════════════════════
const texCache = {};
function getNodeTex(hue) {
  if (texCache[hue]) return texCache[hue];
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 256;
  const c = cvs.getContext('2d');
  const g = c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.12, `hsla(${hue},95%,85%,0.95)`);
  g.addColorStop(0.40, `hsla(${hue},85%,60%,0.5)`);
  g.addColorStop(0.75, `hsla(${hue},70%,40%,0.15)`);
  g.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  texCache[hue] = new THREE.CanvasTexture(cvs);
  return texCache[hue];
}

// ═══════════════════════════════════════════════════
// 노래 노드 + 콘스텔레이션
// ═══════════════════════════════════════════════════
const sprites   = [];
let linesMesh   = null;

function buildGalaxy(songs) {
  sprites.forEach(s => scene.remove(s));
  sprites.length = 0;
  if (linesMesh) scene.remove(linesMesh);

  const n = songs.length;
  songs.forEach((song, i) => {
    const t      = i / n;
    // 4팔 나선 배치
    const arm    = i % 4;
    const angle  = arm * (Math.PI/2) + t * Math.PI * 6;
    const radius = 22 + t * 180;
    const scatter = 22;

    const x = Math.cos(angle)*radius + (Math.random()-.5)*scatter;
    const y = (Math.random()-.5)*45;
    const z = Math.sin(angle)*radius + (Math.random()-.5)*scatter;

    // hue: 보라→파→시안→초록→노랑→주황→분홍 순환 (트롯 느낌의 붉은 계열 최소화)
    const hue = Math.round(200 + (i/n)*300) % 360;

    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getNodeTex(hue),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    }));
    spr.position.set(x, y, z);
    spr.scale.setScalar(13);
    spr.userData = { t: song.t, a: song.a, hue, base: 13 };

    scene.add(spr);
    sprites.push(spr);
  });

  // 콘스텔레이션 라인
  const pts = [], cls = [];
  for (let i = 0; i < sprites.length; i++) {
    for (let j = i+1; j < sprites.length; j++) {
      const d = sprites[i].position.distanceTo(sprites[j].position);
      if (d < 58) {
        const a = (1 - d/58) * 0.6;
        const c1 = new THREE.Color().setHSL(sprites[i].userData.hue/360, .8, .6);
        const c2 = new THREE.Color().setHSL(sprites[j].userData.hue/360, .8, .6);
        pts.push(...sprites[i].position.toArray(), ...sprites[j].position.toArray());
        cls.push(c1.r*a,c1.g*a,c1.b*a, c2.r*a,c2.g*a,c2.b*a);
      }
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  lg.setAttribute('color',    new THREE.Float32BufferAttribute(cls, 3));
  linesMesh = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(linesMesh);

  document.getElementById('count').textContent = `${n} SONGS`;
}

window.addEventListener('click', () => {

  const song = { t: hovered.userData.t, a: hovered.userData.a };

  const idx = sprites.indexOf(hovered);

    ...sprites.slice(idx),
    ...sprites.slice(0, idx),

  playSong(playlist[0]);

// ═══════════════════════════════════════════════════
// 애니메이션 루프
// ═══════════════════════════════════════════════════
let tick = 0;
function animate() {
  requestAnimationFrame(animate);
  tick++;

  controls.update();

  // 호버 감지
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(sprites);

  const newHov = hits.length ? hits[0].object : null;
  if (newHov !== hovered) {
    if (hovered) {
      hovered.scale.setScalar(hovered.userData.base);
      tip.style.opacity = '0';
      cur.classList.remove('hover');
    }
    hovered = newHov;
    if (hovered) {
      cur.classList.add('hover');
      document.getElementById('tip-t').textContent = hovered.userData.t;
      document.getElementById('tip-a').textContent = hovered.userData.a;
    }
  }

  // 호버 노드 확대 + 툴팁
  if (hovered) {
    const pulse = Math.sin(tick * .1) * 2;
    hovered.scale.setScalar(hovered.userData.base * 2.2 + pulse);

    let tx = mouseX + 20, ty = mouseY - 10;
    if (tx + 210 > W) tx = mouseX - 225;
    if (ty + 85  > H) ty = mouseY - 95;
    tip.style.left = tx + 'px';
    tip.style.top  = ty + 'px';
    tip.style.opacity = '1';
  }

  // 모든 노드 숨쉬기
  sprites.forEach((s, i) => {
    if (s === hovered) return;
    const p = Math.sin(tick * .022 + i * .45) * 1.5;
    s.scale.setScalar(s.userData.base + p);
  });

  composer.render();
}

// ═══════════════════════════════════════════════════
// 데이터 로드 & 시작
// ═══════════════════════════════════════════════════
async function init() {
  let songs = FALLBACK;
  try {
    const r = await fetch('music.json?t=' + Date.now());
    if (r.ok) {
      const d = await r.json();
      if (d.songs?.length) {
        songs = d.songs;
        if (d.updated)
          document.getElementById('date-badge').textContent = `AI PICKS · ${d.updated}`;
      }
    }
  } catch {}

  buildGalaxy(songs);

  // 로딩 화면 제거
  const ld = document.getElementById('loading');
  ld.style.transition = 'opacity .8s';
  ld.style.opacity = '0';
  setTimeout(() => ld.remove(), 800);

  animate();
}

init();
</script>
