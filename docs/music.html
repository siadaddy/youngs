<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Universe</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:'Apple SD Gothic Neo',-apple-system,'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; cursor:none; }

    #cur {
      position:fixed; width:10px; height:10px; border-radius:50%;
      background:rgba(255,255,255,.85); pointer-events:none; z-index:999;
      transform:translate(-50%,-50%);
      box-shadow:0 0 10px 3px rgba(255,255,255,.2);
      transition:width .15s,height .15s,background .2s;
    }
    #cur.hover { width:22px; height:22px; background:rgba(255,255,255,.25); }

    /* ── 모바일 ── */
    @media (pointer: coarse) {
      body { cursor: auto; }
      #cur { display: none; }
      #player-bar { height: 80px; padding: 0 16px; }
      .pc-btn { width: 44px; height: 44px; }
      .pc-btn.play-btn { width: 52px; height: 52px; font-size: 20px; }
      #player-title { font-size: 13px; }
    }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

    #top {
      position:absolute; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:28px 36px;
    }
    .logo-wrap { display:flex; flex-direction:column; gap:5px; }
    .logo { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.7); text-transform:uppercase; }
    .logo-sub { font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,.4); text-transform:uppercase; font-style:italic; }
    .back { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.5); text-decoration:none; pointer-events:all; transition:color .3s; }
    .back:hover { color:rgba(255,255,255,.9); }

    #date-badge {
      position:absolute; top:30px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.45); text-transform:uppercase;
    }

    #hint {
      position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:3px; color:rgba(255,255,255,.5); white-space:nowrap;
      animation:hFade 12s ease-in-out forwards;
    }
    @keyframes hFade { 0%,60%{opacity:1} 100%{opacity:0} }

    #count {
      position:absolute; bottom:52px; right:36px;
      font-size:10px; letter-spacing:2px; color:rgba(255,255,255,.4);
    }

    #tip {
      position:fixed; z-index:50; width:220px;
      background:rgba(0,0,12,.93); border:1px solid rgba(255,255,255,.12);
      border-radius:18px; backdrop-filter:blur(24px);
      pointer-events:none; opacity:0; transition:opacity .2s;
      overflow:hidden;
    }
    #tip-art {
      width:100%; height:110px;
      background:rgba(255,255,255,.04);
      overflow:hidden; position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    #tip-art img { width:100%; height:100%; object-fit:cover; }
    #tip-art-bg {
      position:absolute; inset:0; opacity:0.35;
    }
    .tip-body { padding:10px 14px 12px; }
    #tip-t { font-size:13px; font-weight:700; color:rgba(255,255,255,.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #tip-a { font-size:11px; color:rgba(255,255,255,.38); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #tip-genre {
      display:inline-block; margin-top:8px;
      font-size:8px; letter-spacing:1.5px; padding:3px 9px;
      border-radius:20px; text-transform:uppercase; font-weight:600;
    }
    #tip-mood { font-size:10px; color:rgba(255,255,255,.55); margin-top:6px; font-style:italic; }
    #tip-h { font-size:8px; color:rgba(255,255,255,.18); margin-top:8px; letter-spacing:2px; }

    /* ── 장르 범례 ── */
    #legend {
      position:fixed; right:28px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:7px;
      pointer-events:none; z-index:10; opacity:0;
      transition:opacity .5s;
    }
    #legend.show { opacity:1; }
    .legend-item {
      display:flex; align-items:center; gap:8px;
      font-size:8.5px; letter-spacing:1.5px; color:rgba(255,255,255,.5);
      text-transform:uppercase;
    }
    .legend-dot {
      width:8px; height:8px; border-radius:50%; flex-shrink:0;
    }

    /* ── 날짜 히스토리 탭 (상단) ── */
    #date-nav {
      position:absolute; top:28px; left:50%; transform:translateX(-50%);
      display:flex; gap:5px; z-index:20; pointer-events:all;
      opacity:0; transition:opacity .5s;
    }
    #date-nav.show { opacity:1; }
    .date-btn {
      font-size:8.5px; letter-spacing:1.5px; padding:5px 12px;
      border-radius:20px; border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,20,.6); color:rgba(255,255,255,.4);
      cursor:pointer; transition:all .2s; backdrop-filter:blur(10px);
      text-transform:uppercase; white-space:nowrap;
    }
    .date-btn:hover { border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.8); }
    .date-btn.active { border-color:rgba(255,255,255,.45); color:#fff; background:rgba(255,255,255,.08); }
    @media (pointer: coarse) {
      #date-nav { top:auto; bottom:96px; transform:translateX(-50%); }
      .date-btn { padding:7px 14px; font-size:10px; }
    }

    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px; z-index:20;
      background:#000;
    }
    .ld-label { font-size:11px; letter-spacing:4px; color:rgba(255,255,255,.3); text-transform:uppercase; }
    .ld-dots { display:flex; gap:8px; }
    .ld-dots span { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5); animation:dp 1.4s ease-in-out infinite; }
    .ld-dots span:nth-child(2){ animation-delay:.2s; }
    .ld-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes dp { 0%,80%,100%{transform:scale(.5);opacity:.3} 40%{transform:scale(1);opacity:1} }

    /* ── 플레이어 바 ── */
    #player-bar {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      height:90px;
      background:rgba(4,4,18,0.95);
      border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(30px);
      display:flex; align-items:center; gap:16px;
      padding:0 24px;
      transform:translateY(100%);
      transition:transform .4s cubic-bezier(.4,0,.2,1);
      pointer-events:all;
    }
    #player-bar.open { transform:translateY(0); }

    #player-video {
      width:142px; height:80px; border-radius:8px;
      overflow:hidden; flex-shrink:0; position:relative;
      background:#000; cursor:pointer;
    }
    #player-video iframe { width:100%; height:100%; border:0; }
    #player-video .veil {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.35);
      font-size:22px; opacity:0; transition:opacity .2s;
    }
    #player-video:hover .veil { opacity:1; }

    #player-info { flex:1; min-width:0; }
    #player-title {
      font-size:15px; font-weight:600;
      color:rgba(255,255,255,.95);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    #player-artist {
      font-size:12px; color:rgba(255,255,255,.4); margin-top:4px;
    }
    #player-searching {
      font-size:11px; color:rgba(255,255,255,.25);
      letter-spacing:2px; margin-top:5px;
      display:none;
    }
    #player-searching.on { display:block; }

    #player-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .pc-btn {
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.7); font-size:15px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all .2s;
    }
    .pc-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .pc-btn.play-btn { width:48px; height:48px; font-size:18px; background:rgba(255,255,255,.12); }

    #player-close {
      width:32px; height:32px; border-radius:50%;
      background:transparent; border:none;
      color:rgba(255,255,255,.3); font-size:18px;
      cursor:pointer; transition:color .2s;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    #player-close:hover { color:rgba(255,255,255,.8); }

    /* ── NOW PLAYING 토스트 ── */
    #now-toast {
      position:fixed; top:82px; left:50%; transform:translateX(-50%) translateY(-12px);
      display:flex; align-items:center; gap:12px;
      background:rgba(5,5,22,0.93); border:1px solid rgba(255,255,255,.08);
      border-radius:50px; padding:10px 22px 10px 16px;
      backdrop-filter:blur(28px);
      opacity:0; transition:opacity .45s, transform .45s;
      pointer-events:none; z-index:200; white-space:nowrap;
    }
    #now-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #now-dot {
      width:7px; height:7px; border-radius:50%;
      background:rgba(140,190,255,.95);
      box-shadow:0 0 10px 3px rgba(140,190,255,.35);
      animation:nowPulse 1.1s ease-in-out infinite;
      flex-shrink:0;
    }
    @keyframes nowPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
    #now-label { font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,.25); text-transform:uppercase; margin-bottom:2px; }
    #now-title { font-size:13px; font-weight:600; color:rgba(255,255,255,.92); }
    #now-artist { font-size:10px; color:rgba(255,255,255,.35); margin-top:1px; }
  </style>
</head>

// YouTube API를 콜백 등록 후에 동적으로 로드 (타이밍 보장)
window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('yt-frame', {
    height: '80', width: '142',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        isPlaying = e.data === YT.PlayerState.PLAYING;
        document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
        if (e.data === YT.PlayerState.ENDED) playNext();
      },
    },
  });
};
const _yt = document.createElement('script');
_yt.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(_yt);

async function searchVideo(song) {
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_KEY}`;
  const r   = await fetch(url);
  const d   = await r.json();
  return d.items?.[0]?.id?.videoId ?? null;
}

function showNowPlaying(song) {
  document.getElementById('now-title').textContent  = song.t;
  document.getElementById('now-artist').textContent = song.a;
  const t = document.getElementById('now-toast');
  t.classList.add('show');
  clearTimeout(window._nowTimer);
  window._nowTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

async function playSong(song) {
  // 재생 중 별 추적
  playingSprite = sprites.find(s => s.userData.t === song.t && s.userData.a === song.a) ?? null;

  const bar  = document.getElementById('player-bar');
  const srch = document.getElementById('player-searching');
  document.getElementById('player-title').textContent  = song.t;
  document.getElementById('player-artist').textContent = song.a;
  srch.classList.add('on');
  bar.classList.add('open');
  showNowPlaying(song);

  try {
    const vid = await searchVideo(song);
    srch.classList.remove('on');
    if (!vid) {
      window.open(`https://music.youtube.com/search?q=${encodeURIComponent(song.t+' '+song.a)}`, '_blank');
      return;
    }
    // 플레이어 준비 대기 (최대 5초)
    const waitReady = () => new Promise(res => {
      if (ytReady) { res(); return; }
      let n = 0;
      const iv = setInterval(() => {
        if (ytReady || ++n > 50) { clearInterval(iv); res(); }
      }, 100);
    });
    await waitReady();
    if (ytReady) ytPlayer.loadVideoById(vid);
  } catch {
    srch.classList.remove('on');
  }
}

function playNext() {
  if (!playlist.length) return;
  playIdx = (playIdx + 1) % playlist.length;
  playSong(playlist[playIdx]);
}
function playPrev() {
  if (!playlist.length) return;
  playIdx = (playIdx - 1 + playlist.length) % playlist.length;
  playSong(playlist[playIdx]);
}

// 컨트롤 버튼
document.getElementById('btn-play').addEventListener('click', () => {
  if (!ytReady) return;
  isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
});
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-prev').addEventListener('click', playPrev);
document.getElementById('player-close').addEventListener('click', () => {
  if (ytReady) ytPlayer.stopVideo();
  document.getElementById('player-bar').classList.remove('open');
});
// 비디오 클릭 → YouTube에서 열기
document.getElementById('player-video').addEventListener('click', e => {
  if (e.target.closest('.veil') && playlist[playIdx]) {
    const q = encodeURIComponent(`${playlist[playIdx].t} ${playlist[playIdx].a}`);
    window.open(`https://music.youtube.com/search?q=${q}`, '_blank');
  }
});

// ── 앨범 아트 캐시 & 비동기 fetch ──
const artCache = {};
async function fetchArt(song) {
  const key = `${song.t}|${song.a}`;
  if (key in artCache) return artCache[key];
  artCache[key] = null;  // pending
  try {
    const q = encodeURIComponent(`${song.t} ${song.a}`);
    const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&limit=1`);
    const d = await r.json();
    const url = d.results?.[0]?.artworkUrl100;
    artCache[key] = url ? url.replace('100x100bb', '300x300bb') : null;
  } catch { artCache[key] = null; }
  return artCache[key];
}

// 별 배경 (다층 + 색상 다양 + 은하수 띠)
// ═══════════════════════════════════════════════════
(function buildStars() {
  // ── 1. 미세한 별 12,000개 (색상 다양) ──
  {
    const N = 12000;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    // 별 색: 청백(O형), 하얀(A형), 노랑(태양), 주황(K형), 붉은(적색거성)
    const palette = [
      [0.7,0.82,1.0],[0.95,0.95,1.0],[1.0,1.0,0.82],[1.0,0.78,0.55],[1.0,0.52,0.38]
    ];
    for (let i = 0; i < N; i++) {
      pos[i*3]=(Math.random()-.5)*3000; pos[i*3+1]=(Math.random()-.5)*3000; pos[i*3+2]=(Math.random()-.5)*3000;
      const c = palette[Math.floor(Math.random()*palette.length)];
      const b = 0.35 + Math.random()*0.65;
      col[i*3]=c[0]*b; col[i*3+1]=c[1]*b; col[i*3+2]=c[2]*b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:0.5, vertexColors:true, transparent:true, opacity:0.85,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
  // ── 2. 밝은 별 700개 (bloom 반응) ──
  {
    const N = 700;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      pos[i*3]=(Math.random()-.5)*2800; pos[i*3+1]=(Math.random()-.5)*2800; pos[i*3+2]=(Math.random()-.5)*2800;
      const t = Math.random();
      col[i*3]=0.88+t*0.12; col[i*3+1]=0.9+t*0.1; col[i*3+2]=1.0;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:1.6, vertexColors:true, transparent:true, opacity:0.9,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
  // ── 3. 은하수 띠 (기울어진 원반 형태) ──
  {
    const N = 7000;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    const TILT = Math.PI / 5.5;
    for (let i = 0; i < N; i++) {
      const angle  = Math.random() * Math.PI * 2;
      const r      = 350 + Math.random() * 1000;
      const spread = (Math.random() - .5) * 140;
      pos[i*3]   = Math.cos(angle) * r;
      pos[i*3+1] = spread * Math.cos(TILT) + Math.sin(angle) * r * Math.sin(TILT) * 0.18;
      pos[i*3+2] = Math.sin(angle) * r      + spread * Math.sin(TILT) * 0.28;
      const b = 0.15 + Math.random() * 0.45;
      col[i*3]=b*0.88; col[i*3+1]=b*0.84; col[i*3+2]=b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size:0.42, vertexColors:true, transparent:true, opacity:0.5,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })));
  }
})();

// ═══════════════════════════════════════════════════
// 성운 (Nebulae) — 배경 컬러 클라우드
// ═══════════════════════════════════════════════════
const nebulae = [];
function buildNebulae() {
  const configs = [
    { hue:210, x:-850, y: 280, z:-550, size:820 },
    { hue:275, x: 650, y:-320, z:-780, size:700 },
    { hue:330, x:-420, y:-480, z: 720, size:650 },
    { hue:185, x: 880, y: 380, z: 320, size:760 },
    { hue: 35, x: 180, y: 680, z:-680, size:580 },
    { hue:250, x:-720, y: 560, z: 520, size:700 },
    { hue:160, x: 300, y:-650, z:-400, size:540 },
    { hue: 60, x:-200, y: 800, z: 200, size:620 },
    { hue:300, x: 500, y:-700, z: 100, size:550 },
  ];
  configs.forEach(cfg => {
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = 256;
    const ctx = cvs.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,    `hsla(${cfg.hue},80%,65%,0.45)`);
    g.addColorStop(0.38, `hsla(${cfg.hue},70%,50%,0.2)`);
    g.addColorStop(0.72, `hsla(${cfg.hue},60%,40%,0.06)`);
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cvs),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
    }));
    spr.position.set(cfg.x, cfg.y, cfg.z);
    spr.scale.setScalar(cfg.size);
    spr.userData.baseOp = 0.12 + Math.random()*0.1;
    spr.userData.phase  = Math.random() * Math.PI * 2;
    spr.material.opacity = spr.userData.baseOp;
    scene.add(spr);
    nebulae.push(spr);
  });
}

// ═══════════════════════════════════════════════════
// 노드 텍스처 캐시
// ═══════════════════════════════════════════════════
const texCache = {};
function getNodeTex(hue) {
  if (texCache[hue]) return texCache[hue];
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 256;
  const c = cvs.getContext('2d');
  const g = c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.12, `hsla(${hue},95%,85%,0.95)`);
  g.addColorStop(0.40, `hsla(${hue},85%,60%,0.5)`);
  g.addColorStop(0.75, `hsla(${hue},70%,40%,0.15)`);
  g.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  texCache[hue] = new THREE.CanvasTexture(cvs);
  return texCache[hue];
}

// ═══════════════════════════════════════════════════
// 노래 노드 + 콘스텔레이션
// ═══════════════════════════════════════════════════
const sprites   = [];
let linesMesh   = null;

function buildGalaxy(songs) {
  sprites.forEach(s => galaxyGroup.remove(s));
  sprites.length = 0;
  if (linesMesh) galaxyGroup.remove(linesMesh);

  const n = songs.length;
  songs.forEach((song, i) => {
    // 장르 기반 색상
    const genre  = song.g || null;
    const hue    = genre ? (GENRE[genre] || GENRE['기타']).hue : Math.round(200 + (i/n)*300) % 360;

    // 배치: 장르 있으면 클러스터, 없으면 완전 랜덤 구형 분포
    const r = 40 + Math.pow(Math.random(), 0.55) * 140;
    let x, y, z;
    if (genre && GENRE_ANCHORS[genre]) {
      const anchor = GENRE_ANCHORS[genre];
      const theta  = anchor.theta + (Math.random() - 0.5) * 1.8;
      const phi    = anchor.phi   + (Math.random() - 0.5) * 1.0;
      x = r * Math.sin(phi) * Math.cos(theta);
      y = r * Math.sin(phi) * Math.sin(theta);
      z = r * Math.cos(phi);
    } else {
      // 완전 랜덤 구형 분포
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.acos(2 * Math.random() - 1);
      x = r * Math.sin(phi) * Math.cos(theta);
      y = r * Math.sin(phi) * Math.sin(theta);
      z = r * Math.cos(phi);
    }

    // 인기도 기반 노드 크기
    const score = song.s || 7;
    const base  = 9 + score * 0.7;  // score 1 → 9.7, score 10 → 16

    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getNodeTex(hue),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    }));
    spr.position.set(x, y, z);
    const angleXZ = Math.atan2(z, x);
    const radiusXZ = Math.sqrt(x*x + z*z);
    spr.userData = { t: song.t, a: song.a, g: genre, d: song.d || '', hue, base,
      angleXZ, radiusXZ, oy: y,
      speed: 0.0003 + Math.random() * 0.0008,   // 별마다 다른 공전 속도
      phase: Math.random() * Math.PI * 2 };
    spr.scale.setScalar(base);

    galaxyGroup.add(spr);
    sprites.push(spr);
  });

  // 콘스텔레이션 라인 (같은 장르끼리 더 멀어도 연결)
  const pts = [], cls = [];
  for (let i = 0; i < sprites.length; i++) {
    for (let j = i+1; j < sprites.length; j++) {
      const d = sprites[i].position.distanceTo(sprites[j].position);
      const sameGenre = sprites[i].userData.g === sprites[j].userData.g;
      const threshold = sameGenre ? 105 : 60;
      if (d < threshold) {
        const alpha = (1 - d/threshold) * (sameGenre ? 0.65 : 0.28);
        const c1 = new THREE.Color().setHSL(sprites[i].userData.hue/360, .8, .6);
        const c2 = new THREE.Color().setHSL(sprites[j].userData.hue/360, .8, .6);
        pts.push(...sprites[i].position.toArray(), ...sprites[j].position.toArray());
        cls.push(c1.r*alpha,c1.g*alpha,c1.b*alpha, c2.r*alpha,c2.g*alpha,c2.b*alpha);
      }
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  lg.setAttribute('color',    new THREE.Float32BufferAttribute(cls, 3));
  linesMesh = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  galaxyGroup.add(linesMesh);

  document.getElementById('count').textContent = `${n} SONGS`;
}

// ═══════════════════════════════════════════════════
// 마우스 / 레이캐스터
// ═══════════════════════════════════════════════════
const ray   = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
ray.params.Sprite = { threshold: isMobile ? 18 : 10 };

window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
  mouse.x =  (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
});

// ── 데스크탑 클릭 ──
window.addEventListener('click', () => {
  if (!hovered) return;
  const idx = sprites.indexOf(hovered);
  playlist = [...sprites.slice(idx), ...sprites.slice(0, idx)]
    .map(s => ({ t: s.userData.t, a: s.userData.a }));
  playIdx = 0;
  playSong(playlist[0]);
});

// ── 모바일 터치 ──
// 레이캐스터 대신 화면 좌표 직접 비교 (그룹 회전 오차 없음)
let _tx = 0, _ty = 0;
const _wpos = new THREE.Vector3();

window.addEventListener('touchstart', e => {
  const t = e.touches[0];
  _tx = t.clientX; _ty = t.clientY;
}, { passive: true });

window.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - _tx, dy = t.clientY - _ty;
  if (dx*dx + dy*dy > 200) return;   // ~14px 이상 드래그면 무시

  // 각 별의 월드 좌표 → 화면 좌표로 투영 → 탭 위치와 거리 계산
  let closest = null, minDist = Infinity;
  sprites.forEach(s => {
    s.getWorldPosition(_wpos);
    _wpos.project(camera);
    if (_wpos.z > 1) return;   // 카메라 뒤에 있는 별 제외
    const sx = (_wpos.x + 1) / 2 * W;
    const sy = (1 - _wpos.y) / 2 * H;
    const dist = Math.hypot(sx - t.clientX, sy - t.clientY);
    if (dist < minDist) { minDist = dist; closest = s; }
  });

  if (!closest || minDist > 70) return;   // 70px 이내 별만 반응

  const idx = sprites.indexOf(closest);
  playlist = [...sprites.slice(idx), ...sprites.slice(0, idx)]
    .map(sp => ({ t: sp.userData.t, a: sp.userData.a }));
  playIdx = 0;
  playSong(playlist[0]);
}, { passive: true });

// ═══════════════════════════════════════════════════
// 애니메이션 루프
// ═══════════════════════════════════════════════════
let tick = 0;
function animate() {
  requestAnimationFrame(animate);
  tick++;

  // ── 뮤직 에너지 lerp ──
  musicEnergy += ((isPlaying ? 1 : 0) - musicEnergy) * 0.035;

  // 비트 시뮬레이션 ~120 BPM (60fps 기준 0.0333 * 2π rad/frame)
  beatPhase += 0.0333 * Math.PI * 2;
  // beat: 0~1 단방향 펄스 (음악 재생 중일 때만)
  const beat = musicEnergy * Math.max(0, Math.sin(beatPhase)) ** 2;

  // ── 별 개별 공전 — 음악 재생 시에만 회전 (musicEnergy로 smooth start/stop) ──
  sprites.forEach(s => {
    if (s === hovered) return;
    s.userData.angleXZ += s.userData.speed * musicEnergy;
    const a = s.userData.angleXZ;
    const r = s.userData.radiusXZ;
    const drift = Math.sin(tick * 0.005 + s.userData.phase) * 3 * musicEnergy;
    s.position.x = Math.cos(a) * (r + drift);
    s.position.y = s.userData.oy + Math.sin(tick * 0.007 + s.userData.phase * 1.3) * 3 * musicEnergy;
    s.position.z = Math.sin(a) * (r + drift);
  });

  // ── 블룸: 정지 1.6 → 재생 평균 2.4 → 비트 피크 3.2 ──
  bloom.strength = 1.6 + musicEnergy * 0.8 + beat * 0.8;

// ── 성운 숨쉬기 ──
  nebulae.forEach(n => {
    n.userData.phase += 0.004;
    n.material.opacity = n.userData.baseOp + Math.sin(n.userData.phase) * 0.035;
  });

  // ── 별똥별 ──
  if (--shootTimer <= 0) {
    shootTimer = 480 + Math.random() * 660;
    shootStart.set((Math.random()-.5)*1600, 280+Math.random()*380, (Math.random()-.5)*900);
    shootDir.set((Math.random()-.5)*1.2, -1-Math.random()*.8, (Math.random()-.5)*.6).normalize();
    shootProgress = 0;
  }
  if (shootProgress >= 0) {
    shootProgress += 2.8;
    const head = shootStart.clone().addScaledVector(shootDir, shootProgress);
    const tail = shootStart.clone().addScaledVector(shootDir, Math.max(0, shootProgress - 90));
    const arr = shootMesh.geometry.attributes.position.array;
    head.toArray(arr, 0); tail.toArray(arr, 3);
    shootMesh.geometry.attributes.position.needsUpdate = true;
    shootMesh.material.opacity = Math.sin(Math.min(shootProgress/180, 1) * Math.PI) * 0.85;
    if (shootProgress > 200) { shootProgress = -1; shootMesh.material.opacity = 0; }
  }

  controls.update();

  // 호버 감지
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(sprites);

  const newHov = hits.length ? hits[0].object : null;
  if (newHov !== hovered) {
    if (hovered) {
      hovered.scale.setScalar(hovered.userData.base);
      tip.style.opacity = '0';
      cur.classList.remove('hover');
    }
    hovered = newHov;
    if (hovered) {
      cur.classList.add('hover');
      const ud = hovered.userData;
      const gInfo = GENRE[ud.g] || GENRE['기타'];
      document.getElementById('tip-t').textContent = ud.t;
      document.getElementById('tip-a').textContent = ud.a;
      const gEl = document.getElementById('tip-genre');
      gEl.textContent = ud.g || '기타';
      gEl.style.background = gInfo.color + '33';
      gEl.style.color = gInfo.color;
      gEl.style.border = `1px solid ${gInfo.color}55`;
      // 분위기 설명
      const moodEl = document.getElementById('tip-mood');
      moodEl.textContent = ud.d || '';
      // 배경 그라��언트 (항상 표시 — fallback 역할)
      document.getElementById('tip-art-bg').style.background =
        `radial-gradient(circle at 40% 40%, ${gInfo.color}99, ${gInfo.color}22 60%, transparent)`;
      // 이미지 초기화
      const artEl = document.getElementById('tip-art');
      const existing = artEl.querySelector('img');
      if (existing) existing.remove();
      // 앨범 아트 비동기 로드 — 실패해도 배경 그라디언트로 대체
      fetchArt({ t: ud.t, a: ud.a }).then(url => {
        if (!url || hovered?.userData.t !== ud.t) return;
        const img = document.createElement('img');
        img.src = url;
        img.onerror = () => img.remove();  // 깨진 이미지 자동 제거
        artEl.insertBefore(img, artEl.firstChild);
      });
    }
  }

  // 호버 노드 확대 + 툴팁
  if (hovered) {
    const pulse = Math.sin(tick * .1) * 2;
    hovered.scale.setScalar(hovered.userData.base * 2.2 + pulse);

    let tx = mouseX + 20, ty = mouseY - 10;
    if (tx + 210 > W) tx = mouseX - 225;
    if (ty + 85  > H) ty = mouseY - 95;
    tip.style.left = tx + 'px';
    tip.style.top  = ty + 'px';
    tip.style.opacity = '1';
  }

  // ── 재생 중 별 pulse ring ──
  if (playingSprite) {
    // galaxyGroup에 별도 transform 없으므로 local position = world position
    // getWorldPosition()은 matrixWorld 기반이라 한 프레임 뒤처지는 문제 있음
    playRingSpr.position.copy(playingSprite.position);
    const rPulse = Math.sin(tick * 0.07) * 0.5 + 0.5;
    playRingSpr.scale.setScalar(playingSprite.userData.base * (3 + rPulse * 3));
    playRingSpr.material.opacity = 0.08 + rPulse * 0.15 + beat * 0.15;
    // 재생 중 별 크기 강조 (공전은 위 루프에서 이미 처리)
    if (playingSprite !== hovered) {
      playingSprite.scale.setScalar(
        playingSprite.userData.base * (1.8 + Math.sin(tick * 0.1) * 0.3 + beat * 1.2)
      );
    }
  } else {
    playRingSpr.material.opacity = 0;
  }

  // ── 모든 노드 숨쉬기 (음악 에너지 반영) ──
  sprites.forEach((s, i) => {
    if (s === hovered || s === playingSprite) return;
    // 정지: 느린 잔잔한 숨쉬기 / 재생: 빠르고 큰 맥동 + 비트 리액션
    const calmPulse     = Math.sin(tick * .022 + i * .45) * 1.5;
    const energyPulse   = Math.sin(tick * .075 + i * .45) * (2.5 + beat * 6);
    const combinedPulse = calmPulse * (1 - musicEnergy) + energyPulse * musicEnergy;
    s.scale.setScalar(s.userData.base + combinedPulse);
  });

  composer.render();
}

// ═══════════════════════════════════════════════════
// 장르 범례 생성
// ═══════════════════════════════════════════════════
function buildLegend(songs) {
  const present = new Set(songs.map(s => s.g || '기타'));
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  Object.entries(GENRE).forEach(([name, info]) => {
    if (!present.has(name)) return;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-dot" style="background:${info.color};box-shadow:0 0 6px 2px ${info.color}55;"></div>
      <span>${name}</span>`;
    leg.appendChild(item);
  });
  setTimeout(() => leg.classList.add('show'), 1500);
}

// ═══════════════════════════════════════════════════
// 날짜별 히스토리 네비게이션
// ═══════════════════════════════════════════════════
function getDateStr(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toISOString().slice(0, 10);
}

async function loadAndSwitch(daysAgo) {
  const filename = daysAgo === 0 ? 'music.json' : `music_${getDateStr(daysAgo)}.json`;
  try {
    const r = await fetch(filename + '?t=' + Date.now());
    if (!r.ok) return false;
    const d = await r.json();
    if (!d.songs?.length) return false;
    buildGalaxy(d.songs);
    buildLegend(d.songs);
    if (d.updated) document.getElementById('date-badge').textContent = `AI PICKS · ${d.updated}`;
    return true;
  } catch { return false; }
}

async function buildDateNav() {
  const nav = document.getElementById('date-nav');
  const labels = ['오늘','어제','2일 전','3일 전','4일 전','5일 전','6일 전'];
  for (let i = 0; i < 7; i++) {
    const filename = i === 0 ? 'music.json' : `music_${getDateStr(i)}.json`;
    try {
      const r = await fetch(filename, { method: 'HEAD' });
      if (!r.ok) continue;
    } catch { continue; }
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (i === 0 ? ' active' : '');
    btn.textContent = labels[i];
    btn.dataset.daysAgo = i;
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await loadAndSwitch(i);
    });
    nav.appendChild(btn);
  }
  if (nav.children.length > 1) {
    setTimeout(() => nav.classList.add('show'), 1500);
  }
}

// ═══════════════════════════════════════════════════
// 데이터 로드 & 시작
// ═══════════════════════════════════════════════════
async function init() {
  let songs = FALLBACK;
  try {
    const r = await fetch('music.json?t=' + Date.now());
    if (r.ok) {
      const d = await r.json();
      if (d.songs?.length) {
        songs = d.songs;
        if (d.updated)
          document.getElementById('date-badge').textContent = `AI PICKS · ${d.updated}`;
      }
    }
  } catch {}

  buildNebulae();
  initShootStar();

  // ── 재생 ring sprite ──
  const ringCvs = document.createElement('canvas');
  ringCvs.width = ringCvs.height = 256;
  const rctx = ringCvs.getContext('2d');
  const rg = rctx.createRadialGradient(128,128,70,128,128,128);
  rg.addColorStop(0,    'rgba(255,255,255,0)');
  rg.addColorStop(0.55, 'rgba(255,255,255,0.55)');
  rg.addColorStop(0.78, 'rgba(200,220,255,0.25)');
  rg.addColorStop(1,    'rgba(0,0,0,0)');
  rctx.fillStyle = rg; rctx.fillRect(0,0,256,256);
  playRingSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(ringCvs),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0,
  }));
  scene.add(playRingSpr);

  buildGalaxy(songs);
  buildLegend(songs);
  buildDateNav();

  // 로딩 화면 제거
  const ld = document.getElementById('loading');
  ld.style.transition = 'opacity .8s';
  ld.style.opacity = '0';
  setTimeout(() => ld.remove(), 800);

  animate();
}

init();
</script>
