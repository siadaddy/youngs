name: 뉴스레터 자동 수집

on:
  # schedule 비활성화 — daily_AI(Vercel) 로 이전 완료
  # - cron: '40 21 * * *'  # 매일 06:40 KST (UTC+9 → UTC 21:40)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  newsletter:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install requests groq notion-client supabase python-dotenv

      - name: 뉴스레터 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEWSLETTER_DIR: ${{ github.workspace }}/newsletter

        run: |
          cd newsletter
          python3 newsletter_naver.py

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "📰 뉴스레터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push origin main

      - name: 실패 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"${{ secrets.NTFY_TOPIC }}\",\"title\":\"❌ 뉴스레터 수집 실패\",\"message\":\"newsletter job 에러 — GitHub Actions 로그 확인 필요\",\"priority\":4,\"tags\":[\"warning\"]}"

  aicrew:
    runs-on: ubuntu-latest
    needs: newsletter  # newsletter job 완료 후 실행
    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main  # newsletter job이 push한 최신 커밋 가져오기

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install anthropic google-generativeai groq notion-client requests python-dotenv Pillow supabase
          sudo apt-get install -y fonts-noto-cjk

      - name: AI Crew 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_NEWSLETTER_PARENT_ID: ${{ secrets.NOTION_NEWSLETTER_PARENT_ID }}
          NEWSLETTER_DIR: ${{ github.workspace }}/newsletter
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd ai-crew
          python3 main.py

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🎨 AI Crew 카드뉴스 자동 생성 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

      - name: 실패 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"${{ secrets.NTFY_TOPIC }}\",\"title\":\"❌ AI Crew 생성 실패\",\"message\":\"aicrew job 에러 — GitHub Actions 로그 확인 필요\",\"priority\":4,\"tags\":[\"warning\"]}"
